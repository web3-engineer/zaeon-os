# infra/litellm.config.yaml — gateway interno de LLM (PR-G1, Fatia 1 · pool grátis PR-G3, Fatia 7).
# Escopo RÍGIDO: só a camada autônoma passa aqui, e só com GATEWAY_URL setado.
#  - zaeon-flash / zaeon-pro: Vertex Gemini, mesma credencial do app (GOOGLE_CREDENTIALS) — turno do canal.
#  - zaeon-pool-*: POOL GRÁTIS — só chores com conteúdo PÚBLICO da web (§8.10; lib/chore rotaDaChore).
#    UMA conta por provedor (§8.11): uma key por provedor, um deployment por provedor. Proibido 2ª key.
#    O pool NUNCA cai no Vertex (§5.10): todos esgotados = 429 "No deployments available" → fila (G4).
#    Key ausente no .env = aquele deployment falha e o router escorrega para o próximo provedor.
# `model_info.id` = nome do alvo: o LiteLLM devolve no header x-litellm-model-id → ledger.alvo (lib/llm/pool.ts alvoDe).
# Sem GATEWAY_MASTER_KEY o LiteLLM não sobe — auth obrigatória por construção.
model_list:
  # zaeon-flash/zaeon-pro = o GEMINI_MODEL/GEMINI_MODEL_PRO de prod; lib/llm/envelope APELIDO_GATEWAY espelha esta tabela.
  - model_name: zaeon-flash
    litellm_params:
      model: vertex_ai/gemini-3.5-flash
      vertex_project: os.environ/GOOGLE_PROJECT_ID
      vertex_location: os.environ/GEMINI_TEXT_LOCATION   # texto: "global" (ver docker-compose.beta.yml)
      vertex_credentials: os.environ/GOOGLE_CREDENTIALS
    model_info: { id: vertex-flash }
  - model_name: zaeon-pro
    litellm_params:
      model: vertex_ai/gemini-2.5-pro
      vertex_project: os.environ/GOOGLE_PROJECT_ID
      vertex_location: os.environ/GEMINI_TEXT_LOCATION   # texto: "global" (ver docker-compose.beta.yml)
      vertex_credentials: os.environ/GOOGLE_CREDENTIALS
    model_info: { id: vertex-pro }
  # O MODELO REAL, sem apelido (Octa Code): `vertex_ai/<id>` — o chamador manda o id que o app usa
  # (GEMINI_MODEL / GEMINI_MODEL_PRO, lib/ai/model.ts). Trocar o modelo do app troca o do Octa junto.
  - model_name: vertex_ai/*
    litellm_params:
      model: vertex_ai/*
      vertex_project: os.environ/GOOGLE_PROJECT_ID
      vertex_location: os.environ/GEMINI_TEXT_LOCATION   # texto: "global" (ver docker-compose.beta.yml)
      vertex_credentials: os.environ/GOOGLE_CREDENTIALS
    model_info: { id: vertex-real }

  # ── MODELOS PREMIUM (Octa, opt-in) — conta de API da ORG da Zaeon, NÃO assinatura ───────────────
  # Claude/Codex rodando no harness do Octa (lib/octa/modelosPremium + /api/octa/agente), só plano Max.
  # A chave é da conta de API da ORG (Console Anthropic / Platform OpenAI): a assinatura Max/ChatGPT é
  # BLOQUEADA no servidor pelos dois provedores pra app de terceiros e bane a conta. A chave vive SÓ
  # aqui no gateway — infra do dono: pôr ANTHROPIC_API_KEY / OPENAI_API_KEY no env do container do
  # gateway (sem elas, o grupo falha e o app cai na reserva Google). Trocar o modelo (ex.: Sonnet →
  # Opus) = editar o `model:` abaixo. FORA das fallback chains de propósito: o fallback é NO APP
  # (lib/octa/modelo — premium cai no Gemini "forte", e o `servidoPor` da rota mostra quem serviu).
  - model_name: zaeon-claude
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
      timeout: 120
    model_info: { id: anthropic-sonnet }
  - model_name: zaeon-codex
    litellm_params:
      model: openai/gpt-5-codex
      api_key: os.environ/OPENAI_API_KEY
      timeout: 120
    model_info: { id: openai-codex }

  # ── POOL GRÁTIS (Fatia 7) ──────────────────────────────────────────────────────────────
  # Primário: Gemini Flash-Lite no AI Studio — key de conta Google DEDICADA, nunca a do negócio
  # (a do negócio guarda o crédito GenAI, o Vertex dos chats e o OAuth do login). O free tier
  # treina com o conteúdo: por isso só web pública entra aqui. Limites: conferir no console.
  - model_name: zaeon-pool-lite
    litellm_params:
      # 3.5: o 2.5-flash-lite "não está mais disponível pra novos usuários" no AI Studio (404, testado 2026-10-20).
      model: gemini/gemini-3.5-flash-lite
      api_key: os.environ/GEMINI_FREE_API_KEY
      rpm: 15
    model_info: { id: gemini-free }
  # Cloudflare Workers AI (free: ~10k neurons/dia). O provider do LiteLLM monta a URL com
  # CLOUDFLARE_ACCOUNT_ID lido do env do container (env_file) — não é parâmetro do deployment.
  - model_name: zaeon-pool-cf
    litellm_params:
      model: cloudflare/@cf/meta/llama-3.1-8b-instruct
      api_key: os.environ/CLOUDFLARE_API_KEY
    model_info: { id: cloudflare }
  # Groq (free: 8K TPM no modelo — handoff §9.3). llama-3.3-70b-versatile não existe mais na conta.
  - model_name: zaeon-pool-groq
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
      tpm: 8000
    model_info: { id: groq }
  # Cerebras (2026-10-22, decisão do dono: Groq "burro" fica fora da cadeia; Cerebras serve o gpt-oss-120b a ~1300
  # tok/s). Só conteúdo PÚBLICO, como todo o pool. Sem CEREBRAS_API_KEY a chamada falha e cai na reserva Google.
  # Limites do free tier: conferir no console do provedor.
  - model_name: zaeon-pool-cerebras
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
    model_info: { id: cerebras }
  # ── RESERVA GOOGLE (decisão do dono, 2026-10-20) ─────────────────────────────────────────────
  # Pool grátis esgotado/fora → Vertex flash-lite, PAGO e barato. O pool só leva web pública e o Vertex
  # pago não treina com o que recebe: o risco aqui é só custo, e ele aparece — ledger com alvo "vertex"
  # e o painel POOL conta como "vazamento" do grátis. Groq/Cloudflare saíram da cadeia: cota grátis
  # pequena demais (Groq ~1–2 respostas/min; o fallback por ele levava ~11 s). Fora de zaeon-pool-*
  # de propósito: o teste "pool nunca é crédito do negócio" continua valendo pros grupos grátis.
  - model_name: zaeon-reserva-google
    litellm_params:
      model: vertex_ai/gemini-3.5-flash-lite
      vertex_project: os.environ/GOOGLE_PROJECT_ID
      vertex_location: os.environ/GEMINI_TEXT_LOCATION   # texto: "global" (ver docker-compose.beta.yml)
      vertex_credentials: os.environ/GOOGLE_CREDENTIALS
    model_info: { id: vertex }
  # ── MODELOS PRÓPRIOS (Contabo: grátis, CPU, dado não sai da nossa máquina) ─────────────────────
  # O gateway da VPS chama o LiteLLM da Contabo pela tailnet (CONTABO_LLM_URL, sem /v1) com a virtual
  # key gateway-vps (CONTABO_LLM_KEY). litellm_proxy/ serve chat, embeddings E rerank (testado 2026-10-21).
  # CPU = lento (6–9 tok/s; carregar modelo frio leva até ~100 s): timeout próprio de 300 s, e NÃO
  # entram em fallback de nada — quem chama escolhe pelo nome, pra trabalho em que esperar não dói.
  # model_info.id começa com "contabo": o ledger (lib/llm/pool alvoDe) grava alvo "contabo", custo 0.
  - model_name: zaeon-local-lfm2           # LFM2-8B-A1B — o modelo local de texto (papéis curto e artefato), 2026-10-22
    litellm_params:
      model: litellm_proxy/lfm2-8b
      api_base: os.environ/CONTABO_LLM_URL
      api_key: os.environ/CONTABO_LLM_KEY
      timeout: 300
    model_info: { id: contabo-lfm2 }
  - model_name: zaeon-local-coder          # qwen3-coder 30B — código (Octa, entrega depois)
    litellm_params:
      model: litellm_proxy/qwen3-coder
      api_base: os.environ/CONTABO_LLM_URL
      api_key: os.environ/CONTABO_LLM_KEY
      timeout: 300
    model_info: { id: contabo-coder }
  - model_name: zaeon-local-embed          # Qwen3-Embedding 0.6B (1024 dim) — busca do RAG
    litellm_params:
      model: litellm_proxy/qwen3-embed
      api_base: os.environ/CONTABO_LLM_URL
      api_key: os.environ/CONTABO_LLM_KEY
      timeout: 120
    model_info: { id: contabo-embed, mode: embedding }
  - model_name: zaeon-local-rerank         # bge-reranker-v2-m3 — ordenar trechos do RAG (/v1/rerank)
    litellm_params:
      model: litellm_proxy/bge-rerank
      api_base: os.environ/CONTABO_LLM_URL
      api_key: os.environ/CONTABO_LLM_KEY
      timeout: 120
    model_info: { id: contabo-rerank, mode: rerank }
  # GLM (Zhipu) — OFF por padrão (§5.2: provedor fora de BR/EUA; decisão de política). Descomentar = ligar,
  # e acrescentar "zaeon-pool-glm" ao fim da lista de fallbacks abaixo.
  # - model_name: zaeon-pool-glm
  #   litellm_params:
  #     model: openai/glm-4.7-flash
  #     api_base: https://open.bigmodel.cn/api/paas/v4
  #     api_key: os.environ/ZHIPU_API_KEY
  #   model_info: { id: glm }

general_settings:
  master_key: os.environ/GATEWAY_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
  # virtual keys por agente (PR-G2) nascem via /key/generate com budget diário; nada aqui.
  # Pool (G3): scripts/gateway-keys.mjs --pool <agentes> acrescenta zaeon-pool-* à allowlist da key.

litellm_settings:
  drop_params: true
  num_retries: 1
  request_timeout: 45
  # nunca logar prompt/resposta em terceiros: sem callbacks externos.
  success_callback: []
  failure_callback: []

router_settings:
  redis_host: redis
  redis_port: 6379
  # O POOL cai na Cerebras grátis e depois na RESERVA GOOGLE (flash-lite pago, barato e no ledger) — o pool
  # nunca cai em zaeon-flash/zaeon-pro, que são o orçamento do chat. Era cf → groq até 2026-10-20 (decisão do dono).
  # O CHAT (2026-10-24, decisão do dono): o 3.5-flash dava 429 "Resource exhausted" no global SEM reserva — o turno
  # falhava ou re-tentava parado. Agora zaeon-flash → a reserva Google (Vertex pago: o conteúdo do chat nunca vai pro
  # pool grátis, que treina com o que recebe) e zaeon-pro → zaeon-flash.
  fallbacks: [{"zaeon-pool-lite": ["zaeon-pool-cerebras", "zaeon-reserva-google"]}, {"zaeon-pool-cerebras": ["zaeon-reserva-google"]}, {"zaeon-flash": ["zaeon-reserva-google"]}, {"zaeon-pro": ["zaeon-flash", "zaeon-reserva-google"]}]
  allowed_fails: 2
  cooldown_time: 60
  num_retries: 1
  retry_after: 5
