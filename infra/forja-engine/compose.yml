# Forja engine na Contabo — publica a ponte SÓ na Tailscale. RUNBOOK-FORJA-ENGINE.md.
# A IP da Tailscale abaixo é a MESMA box do rea-engine; a Forja usa outra porta (8800).
services:
  forja-engine:
    build:
      context: .
      args:
        GRAPHIFY_VERSION: ${GRAPHIFY_VERSION:-}
        UNDERSTAND_REV: ${UNDERSTAND_REV:-main}
    image: zaeon-forja-engine:local
    container_name: zaeon_forja_engine
    # Fixação de núcleos POR BOX (ver RUNBOOK-FORJA-ENGINE §Onde rodar). Override por env FORJA_CPUSET.
    #   • Contabo (box dos modelos): NUNCA 0-3 (inquilino protegido zenith-adapter, tempo real) → use 4-17.
    #   • App server (sem inquilino de tempo real): um subconjunto pequeno que não roube do app (ex. os 2 últimos núcleos).
    cpuset: "${FORJA_CPUSET:-4-17}"
    environment:
      FORJA_BRIDGE_TOKEN: ${FORJA_BRIDGE_TOKEN:?defina no .env}
      FORJA_BRIDGE_PORT: "8800"
      FORJA_GRAPHIFY_BACKEND: ${FORJA_GRAPHIFY_BACKEND:-}
      FORJA_UNDERSTAND_CMD: ${FORJA_UNDERSTAND_CMD:-}
    ports:
      - "100.113.137.74:8800:8800"   # só a Tailscale enxerga
    tmpfs:
      - /tmp:size=4g
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 8g }
