# LiteLLM — mapeia nomes de modelo → backends locais (Ollama LLMs, TEI embeddings).
# As interfaces/CLIs chamam SEMPRE pelo "model_name" da esquerda, via a URL do
# LiteLLM + a chave. Trocar o modelo real = mudar aqui, sem tocar nas interfaces.
#
# ⚠️ Confirmar os TAGS do Ollama em ollama.com/library antes de puxar — nomes/tags
# mudam. Se um tag não existir, puxar o GGUF direto do HF: `ollama pull hf.co/<repo>:<quant>`.

# THREADS: o Ollama conta os 18 núcleos do host, não o cpuset (14) — com 18 threads
# no cpuset 4-17 o llama.cpp se atropela na barreira e o gpt-oss-20b deu ~0,1 tok/s.
# Medido na Contabo (gpt-oss-20b, quente): 12 thr = 4,0 tok/s · 10 = 5,1 · 8 = 6,2 ·
# 6 = 6,5. Geração em CPU é limitada por banda de memória, não por núcleo: 8 fica no
# platô com load ~7 (folga pro adapter). num_thread vai em options a cada request.

model_list:
  # ── LLMs (Ollama) ──────────────────────────────────────────────────────────
  - model_name: lfm2-8b                      # LFM2-8B-A1B (Liquid AI): o modelo LOCAL de texto desde 2026-10-22
    litellm_params:
      # MoE com ~1,5B ativos: ~3× o Qwen3 30B na CPU (medido 22/10, mapa mental de uma conversa em JSON:
      # lê 74 tok/s, escreve 15 tok/s, ~32 s; Qwen 30B 31/5–8 tok/s, ~69 s; Granite-4-H-Tiny 53/11 e quebrou o formato).
      # Faz o papel "curto" (gatekeeper/juiz) e os artefatos em segundo plano. Saíram: gpt-oss-20b, qwen3 4B/30B, llama-guard.
      model: ollama_chat/hf.co/LiquidAI/LFM2-8B-A1B-GGUF:Q4_K_M
      api_base: http://ollama:11434
      num_thread: 8                          # ver nota THREADS no topo
      num_ctx: 8192                          # um valor só (mudar recarrega o modelo); cabe a conversa inteira de um artefato

  - model_name: qwen3-coder                 # especialista de CÓDIGO (Octa / complexo)
    litellm_params:
      model: ollama_chat/qwen3-coder:30b
      api_base: http://ollama:11434
      num_thread: 8                          # ver nota THREADS no topo

  # ── Claude (Anthropic) — SÓ pro REA, qualidade máxima, pago pelos créditos do dono ──
  # Opt-in no app: REA_MODELO_AGENTE=claude-opus (raciocínio de RE) e REA_MODELO_REDACAO=claude-sonnet
  # (writeup do blueprint). A chave mora AQUI (ANTHROPIC_API_KEY no .env do gateway), nunca no app.
  # Se a API recusar o id, troque pelo nome datado da Anthropic (ex.: claude-opus-4-1-YYYYMMDD).
  - model_name: claude-opus                  # agente octa_rea (Opus)
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: claude-sonnet                # redação do blueprint (Sonnet)
    litellm_params:
      model: anthropic/claude-sonnet-5-5
      api_key: os.environ/ANTHROPIC_API_KEY

  # ── Embeddings (TEI / Hugging Face) ─────────────────────────────────────────
  # TEI expõe /v1/embeddings (OpenAI-compatible). mode: embedding avisa o LiteLLM.
  - model_name: qwen3-embed                  # embedder do RAG (Qwen3-Embedding-0.6B)
    litellm_params:
      model: openai/Qwen/Qwen3-Embedding-0.6B
      api_base: http://tei-embed:80/v1
      api_key: "none"
    model_info:
      mode: embedding

  # ── Reranker (TEI / Hugging Face) ───────────────────────────────────────────
  # Exposto no /v1/rerank (formato Cohere) pra Zaeon chamar pelo gateway como os outros — o
  # provider "huggingface" do LiteLLM fala a API /rerank do TEI. Testado 2026-10-21.
  - model_name: bge-rerank
    litellm_params:
      model: huggingface/BAAI/bge-reranker-v2-m3
      api_base: http://tei-rerank:80
    model_info:
      mode: rerank

  # ── (opcional) cérebro "de ponta" sob demanda — NÃO deixar na rotação ────────
  # Descomente só pra teste manual exclusivo (descarregue os outros antes; ~65 GB).
  # - model_name: gpt-oss-120b
  #   litellm_params:
  #     model: ollama_chat/gpt-oss:120b
  #     api_base: http://ollama:11434

litellm_settings:
  drop_params: true          # ignora params que um modelo local não suporta (não quebra)
  request_timeout: 600       # CPU é lento; dá tempo pro modelo responder

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Com DATABASE_URL setado (no compose), dá pra criar VIRTUAL KEYS por interface
  # (web, CLI #1, CLI #2) com budget e rastreio de uso. Sem DB, usa só a master key.
  database_url: os.environ/DATABASE_URL

# RERANKER: o TEI do reranker (tei-rerank:80) expõe POST /rerank (estilo Cohere/
# Infinity). O LiteLLM tem endpoint de rerank, mas o mapeamento varia de versão —
# no MVP o pipeline de RAG pode chamar http://tei-rerank:80/rerank DIRETO (rede
# interna). Documentado no RUNBOOK. (Não é um "model" de chat, por isso fica fora
# do model_list.)
