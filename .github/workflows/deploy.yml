name: Deploy (VPS)

# Deploy da beta no VPS via SSH: atualiza o código e sobe os containers.
# Roda no push pra main OU manualmente (workflow_dispatch). Só executa de verdade se
# os secrets do VPS estiverem configurados (guard abaixo) — assim não falha à toa.
#
# Este workflow não conhece o IP da box: tudo vem dos secrets. Trocar de VPS =
# trocar os secrets abaixo, sem tocar em código. Ver docs/BETA_DEPLOY.md.
#
# Secrets necessários (Settings → Secrets and variables → Actions):
#   VPS_HOST       → IP da box (ex.: 75.119.140.97)
#   VPS_PORT       → porta SSH (22 no padrão; a box antiga usava 22022)
#   VPS_USER       → root
#   VPS_SSH_KEY    → chave PRIVADA SSH (conteúdo completo) com acesso ao VPS
#   DEPLOY_PATH    → caminho do repo no VPS (ex.: /root/zaeon-os)
#   GOOGLE_CREDENTIALS_B64  → base64 do JSON da service account (Vertex)
#   GOOGLE_PROJECT_ID_VALUE → id do projeto GCP

on:
  push:
    branches: [main]
    paths-ignore:        # não redeploya por mudança só de doc
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild das imagens (--build)"
        type: boolean
        default: true

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets do VPS ausentes — deploy pulado. Configure VPS_HOST/VPS_SSH_KEY/etc."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Segredos de runtime injetados pelo GitHub → materializados em .env.secrets no VPS.
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_PROJECT_ID_VALUE: ${{ secrets.GOOGLE_PROJECT_ID_VALUE }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          # Repassa os segredos do bloco env: acima para dentro do script remoto.
          envs: GOOGLE_CREDENTIALS_B64,GOOGLE_PROJECT_ID_VALUE
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            # Qual compose subir: beta enxuto por padrão (web+redis+caddy).
            # Para a stack completa, crie a var DEPLOY_COMPOSE=docker-compose.yml.
            export COMPOSE_FILE="${{ vars.DEPLOY_COMPOSE || 'docker-compose.beta.yml' }}"
            echo "→ Compose: $COMPOSE_FILE"
            echo "→ Atualizando código…"
            git fetch --all --prune
            git reset --hard origin/main
            # Grava segredos de runtime FORA do git (compose lê via env_file: [.env, .env.secrets]).
            if [ -n "${GOOGLE_CREDENTIALS_B64:-}" ]; then
              echo "→ Gravando .env.secrets (credencial Vertex)…"
              umask 177
              {
                echo "GOOGLE_CREDENTIALS=$(printf '%s' "$GOOGLE_CREDENTIALS_B64" | base64 -d | tr -d '\n')"
                echo "GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID_VALUE}"
              } > .env.secrets
            else
              echo "::warning::GOOGLE_CREDENTIALS_B64 vazio — mantendo .env.secrets atual (se houver)."
              touch .env.secrets
            fi
            # GIT_SHA runtime-only → /api/health expõe o commit em prod. Anexado DEPOIS
            # da materialização acima (que reescreve .env.secrets com `>`), senão seria clobado.
            echo "GIT_SHA=$(git rev-parse --short HEAD)" >> .env.secrets
            # Harness da Aura LIGADO por padrão no deploy: só escreve se a flag estiver AUSENTE,
            # p/ respeitar um kill-switch manual (AURA_HARNESS=0 via deploy-harness.yml) até
            # alguém religar. Ausente == "1" no código, mas explícito evita ambiguidade no .env.
            touch .env
            if ! grep -q '^AURA_HARNESS=' .env; then
              echo "AURA_HARNESS=1" >> .env
              echo "→ AURA_HARNESS=1 (ligado no deploy)"
            else
              echo "→ AURA_HARNESS mantido: $(grep '^AURA_HARNESS=' .env)"
            fi
            echo "→ Subindo containers…"
            docker compose up -d --build --remove-orphans
            # Garante que o web recarregue a credencial nova (é runtime-only).
            docker compose up -d --force-recreate web
            # Schema ADITIVO junto do deploy (Mongo: cria coleções/índices novos — mentor_templates,
            # plugged_mentors, memory_drawers…; nunca migra dados). Roda DENTRO do web novo, então
            # usa o schema da imagem recém-buildada. Falha vira warning: o app sobe mesmo assim
            # (as rotas degradam com fallback), e o índice único/coleção pode ser criado depois
            # via deploy-harness.yml (db_push=true).
            echo "→ prisma db push (schema aditivo)…"
            # (sem --accept-data-loss: em modo não-interativo o Prisma RECUSA mudança destrutiva → só aditivo)
            if docker compose exec -T web npx prisma db push --skip-generate 2>&1 | tail -20; then
              echo "✓ db push ok"
            else
              echo "::warning::prisma db push falhou — app no ar; rode deploy-harness.yml com db_push=true e confira os logs do web."
            fi
            echo "→ Limpando imagens órfãs…"
            docker image prune -f
            echo "✓ Deploy concluído."
