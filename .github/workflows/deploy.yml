name: Deploy (VPS)

# Deploy autônomo da Zaeon no VPS via SSH — estilo "coexist-prod": sobe a Zaeon
# SEM derrubar outras stacks no mesmo servidor (ex.: ChipFlow/disparos), porque o
# compose é isolado por nome de projeto (name: zaeon-beta) e a gente NÃO usa
# --remove-orphans nem mexe em containers de fora do projeto.
#
# Dispara no push pra main (ignora docs) OU manualmente (workflow_dispatch, com opções).
# Só executa de verdade se os secrets do VPS existirem (guard) — assim não falha à toa.
#
# Blindagens que nasceram do deploy manual de 2026-09-14:
#   • .env.secrets é ESCRITO pelo pipeline a partir do secret base64 → credencial
#     Vertex sempre numa linha só (nunca mais o erro de "@ in variable name").
#   • cria swap de 8G se não existir (a box travou por falta de RAM no build+voz).
#   • sobe só web+redis+caddy por padrão (voice-engine/abnt são glutões de RAM e
#     ficam opcionais — liguem com a var/opção with_voice).
#   • health-gate: o job FALHA e mostra logs se o /api/health não responder.
#
# Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   VPS_HOST                → 75.119.140.97
#   VPS_PORT                → 22
#   VPS_USER                → root
#   VPS_SSH_KEY             → chave PRIVADA SSH (conteúdo completo) com acesso ao VPS
#   DEPLOY_PATH             → /root/zaeon-os
#   GOOGLE_CREDENTIALS_B64  → base64 do JSON do service account (uma linha)
#   GOOGLE_PROJECT_ID_VALUE → id do projeto Google
# Vars opcionais (aba Variables):
#   DEPLOY_COMPOSE          → override do compose (default docker-compose.beta.yml)
#   DEPLOY_WITH_VOICE       → "true" liga voice-engine/abnt/pdf-loader no deploy
#   BETA_DOMAIN             → hostnames do Caddy (vírgula). Default cobre zaeon.com.br,
#                             www e o sslip.io provisório — os três ao mesmo tempo.
#   APP_URL                 → URL pública (default https://75-119-140-97.sslip.io);
#                             vira NEXTAUTH_URL — trocar aqui quando o domínio mudar.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild das imagens (--build)"
        type: boolean
        default: true
      with_voice:
        description: "Subir também voice-engine/abnt/pdf-loader (come RAM)"
        type: boolean
        default: false
      db_push:
        description: "Rodar prisma db push (migra schema no Atlas)"
        type: boolean
        default: true
      deploy_branch:
        description: "Branch a implantar (default main). Ex.: aura/base-coworking-harness p/ testar sem passar pelo main."
        type: string
        default: "main"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets do VPS ausentes — deploy pulado. Configure VPS_HOST/VPS_SSH_KEY/etc."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_PROJECT_ID_VALUE: ${{ secrets.GOOGLE_PROJECT_ID_VALUE }}
          # Bearer do cron diário de evals do Octa (.github/workflows/octa-evals.yml manda o mesmo secret).
          OCTA_CRON_SECRET: ${{ secrets.OCTA_CRON_SECRET }}
          # #641: o Redis do limitador de uso (src/lib/ratelimit). Antes só vivia no `.env` do VPS — trocar a credencial
          # exigia entrar no servidor. Preenchidos, vão pro .env.secrets (que vence o .env); vazios, o .env decide.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Reserva/caminho do Hugging Face (lib/llm/reservaHf). O token NUNCA esteve no pipeline: sem
          # ele no `.env` do VPS, `reservaHfLigada()` é falso e a reserva está DESLIGADA em produção —
          # inclusive nos disparos. Preenchido, vai pro .env.secrets (que vence o .env); vazio, o .env decide.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # #686: a chave do Resend (o código de entrar por e-mail). Preenchida, vai pro .env.secrets; vazia, o .env decide.
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # PUSHER (tempo real do documento colaborativo — lib/collab/realtime). Quatro variáveis, e
          # duas NATUREZAS: o APP_ID e o SECRET são server-only e vão pro .env.secrets; a KEY e o
          # CLUSTER são NEXT_PUBLIC — embutidos no bundle do navegador no BUILD, então precisam estar
          # exportados na hora do `docker compose build` (laço `for k in` abaixo) além do runtime.
          # Sem as quatro, `getPusher()` devolve null e a colaboração cai no poll de 6 s: funciona,
          # mas não é instantânea. Secrets: Settings → Secrets and variables → Actions.
          PUSHER_APP_ID: ${{ secrets.PUSHER_APP_ID }}
          PUSHER_SECRET: ${{ secrets.PUSHER_SECRET }}
          NEXT_PUBLIC_PUSHER_KEY: ${{ vars.NEXT_PUBLIC_PUSHER_KEY || '' }}
          NEXT_PUBLIC_PUSHER_CLUSTER: ${{ vars.NEXT_PUBLIC_PUSHER_CLUSTER || '' }}
          # A fase `reason` no modo `elaborated`. O código a PULA por padrão (eval de out/2026: com um
          # documento ela não melhorava a resposta e custava latência). Ligada aqui por decisão do
          # dono; `vars.RACIOCINIO_ELABORADO=0` desliga sem deploy de código.
          RACIOCINIO_ELABORADO: ${{ vars.RACIOCINIO_ELABORADO || '1' }}
          # F8 · O AGENTE DE NAVEGADOR (rota /api/agentic/run + tela /agente). Ligado por decisão do
          # dono ("todos com flag on"), e o que torna isso defensável é o alcance: a rota e a tela
          # são de FUNDADOR/super_admin (assertAdmin), então ligar não expõe nada a aluno nenhum —
          # faz a página EXISTIR pro dono, que é o único jeito de ele experimentar.
          #
          # O preço, dito antes de ligar: (a) é código novo, cujas primeiras horas de produção são
          # estas — tem smoke-test com Chromium real, não tem horas de uso; (b) enquanto um run está
          # ativo há um Chromium no `web`, e o limite de memória de lá é apertado (por isso UM run
          # por processo e teto de 12 passos / 3 min); (c) ele é SOMENTE LEITURA por duas travas de
          # código (o driver recusa escrita, a rota não passa `approve`) e só alcança os domínios de
          # LEITOR_ALLOW. `vars.AGENTIC_MODE=0` desliga sem deploy de código.
          AGENTIC_MODE: ${{ vars.AGENTIC_MODE || '1' }}
          # F9 · ONDE o navegador do agente roda. Vazia = o compose decide (default: o container
          # irmão `agente-navegador`). Preencher com string vazia NÃO é "desligar o container": é
          # mandar o Chromium subir dentro do `web` outra vez, que é o que a F9 veio desfazer.
          AGENTE_URL: ${{ vars.AGENTE_URL || '' }}
          # F10c · a allowlist do agente. Vazia = o SHELL põe `*` (internet aberta, pedido do dono).
          # A forma é a MESMA do AGENTE_URL de propósito: a F10 usou `|| '*'` e o GitHub recusou o
          # arquivo inteiro (startup failure, zero jobs, deploy 567). Como `*` é token de wildcard
          # nas expressões do Actions, o default saiu da EXPRESSÃO e foi pro shell, onde é só texto.
          AGENTE_ALLOW: ${{ vars.AGENTE_ALLOW || '' }}
          # Workers de fundo (BullMQ). NÃO são features desligadas: sem eles o trabalho roda INLINE no
          # web, que é o que acontece hoje e funciona. Ligá-los no `web` faria o mesmo container
          # enfileirar E consumir — o desenho quer o serviço `worker` dedicado (perfil "worker" do
          # compose), que é decisão operacional de quem sobe a stack, não flag. Ficam ALCANÇÁVEIS:
          # preenchida a Variable, chegam no container; vazias, nada muda.
          SCHOLAR_WORKER: ${{ vars.SCHOLAR_WORKER || '' }}
          CANAL_WORKER: ${{ vars.CANAL_WORKER || '' }}
          CHORES_WORKER: ${{ vars.CHORES_WORKER || '' }}
          CANAL_QUEUE: ${{ vars.CANAL_QUEUE || '' }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM || '' }}
          # Runtime (não entram no bundle): valem sem rebuild, só recriando o web.
          HF_RESERVA: ${{ vars.HF_RESERVA || '' }}
          DISPAROS_HF: ${{ vars.DISPAROS_HF || '' }}
          DISPAROS_HF_SEM_HISTORICO: ${{ vars.DISPAROS_HF_SEM_HISTORICO || '' }}
          # opções (push usa defaults; dispatch respeita os inputs)
          WITH_VOICE: ${{ github.event.inputs.with_voice || vars.DEPLOY_WITH_VOICE || 'false' }}
          DB_PUSH: ${{ github.event.inputs.db_push || 'true' }}
          # Branch a implantar (push→main; dispatch pode escolher outra, ex.: aura p/ testar).
          DEPLOY_BRANCH: ${{ github.event.inputs.deploy_branch || 'main' }}
          # URL pública do app → vira NEXTAUTH_URL no compose (redirect do Google).
          APP_URL: ${{ vars.APP_URL || 'https://75-119-140-97.sslip.io' }}
          # Hostnames do Caddy. O Caddy exige vírgula + ESPAÇO entre site addresses:
          # 'a,b' derruba o container em loop ("Site addresses cannot contain a comma").
          # Já aconteceu em 26/09 e tirou o HTTPS do ar. O script normaliza os dois
          # formatos antes de subir, mas escreva a Variable com espaço mesmo assim.
          # O default é só o endereço provisório DE PROPÓSITO: pedir certificado pra um
          # domínio que ainda não resolve gasta tentativa de ACME à toa. Quando o DNS do
          # zaeon.com.br subir, setar a Variable BETA_DOMAIN e redeployar — feito em
          # 26/09: hoje ela vale 'zaeon.com.br, 75-119-140-97.sslip.io'. O www fica FORA
          # da lista: tem bloco próprio de redirect no Caddyfile, porque o client OAuth
          # do Google não aceita o callback com www.
          BETA_DOMAIN: ${{ vars.BETA_DOMAIN || '75-119-140-97.sslip.io' }}
          # E-mail do ACME (Let's Encrypt manda aviso de expiração pra cá). O default do
          # compose é um endereço em zaeon.space, domínio que EXPIROU — aviso indo pro vazio.
          ACME_EMAIL: ${{ vars.ACME_EMAIL || '' }}
          # Flags de BUILD do escritório coworking (NEXT_PUBLIC_* entram no bundle: só valem no
          # build). Vêm das Variables do repo (Settings → Variables); vazia = não exporta e o
          # `.env` do VPS (ou o default 0 do compose) decide. Rollback = Variable "0" + redeploy.
          NEXT_PUBLIC_ESCRITORIO_COWORK: ${{ vars.NEXT_PUBLIC_ESCRITORIO_COWORK || '' }}
          NEXT_PUBLIC_AGENTS_ADMIN: ${{ vars.NEXT_PUBLIC_AGENTS_ADMIN || '' }}
          NEXT_PUBLIC_AGENT_AVATARS: ${{ vars.NEXT_PUBLIC_AGENT_AVATARS || '' }}
          # Sala de Pesquisa unificada (mesma mecânica; rollback = Variable "0" + redeploy).
          NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM: ${{ vars.NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM || '' }}
          NEXT_PUBLIC_MAP_HARNESS: ${{ vars.NEXT_PUBLIC_MAP_HARNESS || '' }}
          # CHAT ÚNICO ligado por decisão do dono (05/nov/2026). NÃO é só uma flag: a "Sala de
          # Pesquisa" sai da sidebar, os links antigos (?tab=pesquisa, ?work=) caem no chat da Aura,
          # a conversa ganha o interruptor "Modo pesquisa" e pode ter VÁRIOS trabalhos. Mudança de
          # navegação visível — `vars.NEXT_PUBLIC_CHAT_UNICO=0` volta ao layout anterior.
          NEXT_PUBLIC_CHAT_UNICO: ${{ vars.NEXT_PUBLIC_CHAT_UNICO || '1' }}
          NEXT_PUBLIC_BLUEPRINT_PRATICO: ${{ vars.NEXT_PUBLIC_BLUEPRINT_PRATICO || '' }}
          NEXT_PUBLIC_VIDEO_DOC: ${{ vars.NEXT_PUBLIC_VIDEO_DOC || '' }}
          NEXT_PUBLIC_LOUNGE_3D: ${{ vars.NEXT_PUBLIC_LOUNGE_3D || '' }}
          NEXT_PUBLIC_MOBILE_UI: ${{ vars.NEXT_PUBLIC_MOBILE_UI || '' }}
          NEXT_PUBLIC_PROJETOS: ${{ vars.NEXT_PUBLIC_PROJETOS || '' }}
          NEXT_PUBLIC_MENTORES_TAB: ${{ vars.NEXT_PUBLIC_MENTORES_TAB || '' }}
          NEXT_PUBLIC_OCTA_CODE: ${{ vars.NEXT_PUBLIC_OCTA_CODE || '' }}
          NEXT_PUBLIC_OCTA_REA: ${{ vars.NEXT_PUBLIC_OCTA_REA || '' }}
          NEXT_PUBLIC_REA_BLUEPRINT: ${{ vars.NEXT_PUBLIC_REA_BLUEPRINT || '' }}
          NEXT_PUBLIC_CYBER_AVATAR_GLB: ${{ vars.NEXT_PUBLIC_CYBER_AVATAR_GLB || '' }}
          NEXT_PUBLIC_CYBER_LANDMARKS: ${{ vars.NEXT_PUBLIC_CYBER_LANDMARKS || '' }}
          NEXT_PUBLIC_AURA_ECONOMY: ${{ vars.NEXT_PUBLIC_AURA_ECONOMY || '' }}
          # realtime do cyberespaço: Variables NEXT_PUBLIC_REALTIME (pusher|colyseus) e NEXT_PUBLIC_VOZ (on|off)
          NEXT_PUBLIC_REALTIME: ${{ vars.NEXT_PUBLIC_REALTIME || '' }}
          NEXT_PUBLIC_VOZ: ${{ vars.NEXT_PUBLIC_VOZ || '' }}
          # Flags de SERVIDOR (runtime): cérebro, gatekeeper, economia AURA.
          MAP_HARNESS: ${{ vars.MAP_HARNESS || '' }}
          # o par SERVIDOR do de cima: liga o motor dos trabalhos (lib/tcc/store `tccCrossOn`).
          CHAT_UNICO: ${{ vars.CHAT_UNICO || '1' }}
          # O TRILHO DO DOCUMENTO, explícito. `tccCrossOn()` é `TCC_CROSS=1 || CHAT_UNICO=1`, e até
          # agora NENHUMA das duas passava pelo workflow: viviam só no `.env` do VPS e não apareciam
          # no recibo. A F6, a F7 e a D9 foram construídas sobre este trilho sem que eu pudesse VER
          # o interruptor — ponto cego que o dono mandou fechar. O par NEXT_PUBLIC_ é build-arg (as
          # abas dos trabalhos no cliente), e as duas metades podem divergir: servidor ON com cliente
          # OFF significa documento que nasce e ninguém vê.
          TCC_CROSS: ${{ vars.TCC_CROSS || '1' }}
          NEXT_PUBLIC_TCC_CROSS: ${{ vars.NEXT_PUBLIC_TCC_CROSS || '1' }}
          # turno do chat em segundo plano (fila dentro do web). PREÇO, do próprio compose: um deploy
          # que recria o web MATA o turno em curso (o reaper marca erro no boot). Ligado por decisão
          # do dono; `vars.CHAT_BG=0` volta ao inline, que sobrevive ao deploy.
          CHAT_BG: ${{ vars.CHAT_BG || '1' }}
          # F2 do documento: uma chamada por seção em vez de um JSON de 8 campos. Runtime (não entra
          # no bundle), então vale recriando o web — sem rebuild. Vazia = o caminho antigo.
          DOC_POR_SECAO: ${{ vars.DOC_POR_SECAO || '' }}
          BLUEPRINT_PRATICO: ${{ vars.BLUEPRINT_PRATICO || '' }}
          REA_BLUEPRINT: ${{ vars.REA_BLUEPRINT || '' }}
          VIDEO_DOC: ${{ vars.VIDEO_DOC || '' }}
          # contrato de capacidade do harness (lib/agent/capacidades): o cardápio no prompt + a rede
          # contra promessa sem lastro. Ver docs/PLANO_HARNESS_AGENTICO.md.
          HARNESS_CAPACIDADE: ${{ vars.HARNESS_CAPACIDADE || '' }}
          # F2: o modelo escolhe a ferramenta (laço reentrante). VOLTAS limita o custo:
          # +2 chamadas de modelo no pior caso; 0 mantém a F2 ligada sem volta extra.
          HARNESS_ACAO: ${{ vars.HARNESS_ACAO || '' }}
          HARNESS_VOLTAS_ACAO: ${{ vars.HARNESS_VOLTAS_ACAO || '' }}
          PRO_PESADAS: ${{ vars.PRO_PESADAS || '' }}
          # F3: PDF anexado com texto aproveitável entra no harness (imagem e PDF escaneado
          # seguem no caminho legado multimodal — só ele os lê).
          HARNESS_ANEXO: ${{ vars.HARNESS_ANEXO || '' }}
          # F4: com 2+ documentos em jogo, a busca cobre TODO documento e a fase `reason` vira
          # síntese cruzada (+1 chamada de modelo, só nesses turnos).
          HARNESS_SINTESE: ${{ vars.HARNESS_SINTESE || '' }}
          HARNESS_GRAFICO: ${{ vars.HARNESS_GRAFICO || '' }}
          # F5: conectores MCP, por NOME do MCP_CATALOG. Só tools de LEITURA entram no registry.
          # `scholar` por padrão (2026-11-03): o SDK e o servidor agora estão PINADOS no
          # package.json, então não há mais "exige npm i" nem download em boot.
          # Para desligar: Variable MCP_CONECTORES=0 (ou off/nenhum) — vazio cai no padrão.
          MCP_CONECTORES: ${{ vars.MCP_CONECTORES || 'scholar' }}
          # LEITOR (Fatia 7): o container que lê a web sem credencial. `abrir_url` do harness só é
          # REGISTRADA quando LEITOR_PROXY_URL existe — sem ela a Aura diz que não abre endereços.
          # LEITOR_ALLOW é a allowlist default-deny (vazia = nenhum domínio sai).
          LEITOR_PROXY_URL: ${{ vars.LEITOR_PROXY_URL || '' }}
          LEITOR_ALLOW: ${{ vars.LEITOR_ALLOW || '' }}
          # tetos do Leitor (texto 2 MiB / bytes 25 MB por padrão — fundamentados em server.mjs)
          LEITOR_MAX_BYTES: ${{ vars.LEITOR_MAX_BYTES || '' }}
          LEITOR_MAX_BYTES_BIN: ${{ vars.LEITOR_MAX_BYTES_BIN || '' }}
          GITHUB_TOKEN_BLUEPRINT: ${{ secrets.GITHUB_TOKEN_BLUEPRINT || '' }}
          ESTUDO_GATEKEEPER: ${{ vars.ESTUDO_GATEKEEPER || '' }}
          AURA_ECONOMY: ${{ vars.AURA_ECONOMY || '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: GOOGLE_CREDENTIALS_B64,GOOGLE_PROJECT_ID_VALUE,OCTA_CRON_SECRET,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,HF_TOKEN,RESEND_API_KEY,EMAIL_FROM,HF_RESERVA,DISPAROS_HF,DISPAROS_HF_SEM_HISTORICO,WITH_VOICE,DB_PUSH,DEPLOY_BRANCH,APP_URL,BETA_DOMAIN,ACME_EMAIL,NEXT_PUBLIC_ESCRITORIO_COWORK,NEXT_PUBLIC_AGENTS_ADMIN,NEXT_PUBLIC_AGENT_AVATARS,NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM,NEXT_PUBLIC_MAP_HARNESS,NEXT_PUBLIC_LOUNGE_3D,NEXT_PUBLIC_CYBER_AVATAR_GLB,NEXT_PUBLIC_CYBER_LANDMARKS,NEXT_PUBLIC_AURA_ECONOMY,NEXT_PUBLIC_REALTIME,NEXT_PUBLIC_VOZ,NEXT_PUBLIC_MOBILE_UI,NEXT_PUBLIC_PROJETOS,NEXT_PUBLIC_MENTORES_TAB,NEXT_PUBLIC_OCTA_CODE,NEXT_PUBLIC_OCTA_REA,MAP_HARNESS,ESTUDO_GATEKEEPER,AURA_ECONOMY,NEXT_PUBLIC_CHAT_UNICO,DOC_POR_SECAO,CHAT_UNICO,TCC_CROSS,NEXT_PUBLIC_TCC_CROSS,CHAT_BG,NEXT_PUBLIC_BLUEPRINT_PRATICO,BLUEPRINT_PRATICO,GITHUB_TOKEN_BLUEPRINT,NEXT_PUBLIC_VIDEO_DOC,VIDEO_DOC,NEXT_PUBLIC_REA_BLUEPRINT,REA_BLUEPRINT,HARNESS_CAPACIDADE,HARNESS_ACAO,HARNESS_VOLTAS_ACAO,PRO_PESADAS,HARNESS_ANEXO,HARNESS_SINTESE,HARNESS_GRAFICO,MCP_CONECTORES,PUSHER_APP_ID,PUSHER_SECRET,NEXT_PUBLIC_PUSHER_KEY,NEXT_PUBLIC_PUSHER_CLUSTER,RACIOCINIO_ELABORADO,AGENTIC_MODE,AGENTE_URL,AGENTE_ALLOW,SCHOLAR_WORKER,CANAL_WORKER,CHORES_WORKER,CANAL_QUEUE,LEITOR_PROXY_URL,LEITOR_ALLOW,LEITOR_MAX_BYTES,LEITOR_MAX_BYTES_BIN
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export COMPOSE_FILE="${{ vars.DEPLOY_COMPOSE || 'docker-compose.beta.yml' }}"
            DC="docker compose -f $COMPOSE_FILE"
            echo "→ Compose: $COMPOSE_FILE   with_voice=$WITH_VOICE   db_push=$DB_PUSH"

            echo "→ Swap (blindagem de RAM)…"
            if ! swapon --show | grep -q /swapfile; then
              fallocate -l 8G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
              echo "  swap de 8G criado."
            else
              echo "  swap já existe."
            fi

            echo "→ Atualizando código (branch: ${DEPLOY_BRANCH})…"
            git fetch --all --prune
            git reset --hard "origin/${DEPLOY_BRANCH}"
            export GIT_SHA="$(git rev-parse --short HEAD)"
            echo "-> Commit no deploy: $GIT_SHA"

            echo "→ Gravando .env.secrets (credencial Vertex em UMA linha)…"
            umask 177
            if [ -n "${GOOGLE_CREDENTIALS_B64:-}" ]; then
              {
                echo "GOOGLE_CREDENTIALS=$(printf '%s' "$GOOGLE_CREDENTIALS_B64" | base64 -d | tr -d '\n')"
                echo "GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID_VALUE}"
                if [ -n "${OCTA_CRON_SECRET:-}" ]; then echo "OCTA_CRON_SECRET=${OCTA_CRON_SECRET}"; fi
              } > .env.secrets
            else
              echo "::warning::GOOGLE_CREDENTIALS_B64 vazio — mantendo .env.secrets atual (se houver)."
              touch .env.secrets
            fi
            # #641: Upstash (limitador de uso) a partir dos Secrets — troca as linhas antigas, mantém o resto do arquivo.
            # Só com os DOIS preenchidos (meio par = Redis quebrado; aí o .env do VPS continua valendo).
            if [ -n "${UPSTASH_REDIS_REST_URL:-}" ] && [ -n "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
              grep -v '^UPSTASH_REDIS_REST_' .env.secrets > .env.secrets.tmp || true
              {
                cat .env.secrets.tmp
                echo "UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}"
                echo "UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}"
              } > .env.secrets
              rm -f .env.secrets.tmp
              echo "→ Upstash: credencial dos Secrets gravada no .env.secrets"
            else
              echo "→ Upstash: Secrets vazios — vale o .env do VPS"
            fi
            # HF: o token é SECRET (vai pro .env.secrets); as três chaves de comportamento são Variables
            # e entram no mesmo arquivo pra valerem sem rebuild. Cada uma só é gravada se vier preenchida —
            # linha vazia aqui SOBRESCREVERIA o `.env` do VPS e desligaria o que já estava ligado.
            if [ -n "${HF_TOKEN:-}" ] || [ -n "${HF_RESERVA:-}" ] || [ -n "${DISPAROS_HF:-}" ] || [ -n "${DISPAROS_HF_SEM_HISTORICO:-}" ]; then
              grep -vE '^(HF_TOKEN|HF_RESERVA|DISPAROS_HF|DISPAROS_HF_SEM_HISTORICO)=' .env.secrets > .env.secrets.tmp || true
              {
                cat .env.secrets.tmp
                # `|| true` em cada uma: o script roda com `set -e`, e um teste falso sem isso
                # devolveria 1 e derrubaria o deploy justamente quando a chave está vazia.
                { [ -n "${HF_TOKEN:-}" ] && echo "HF_TOKEN=${HF_TOKEN}"; } || true
                { [ -n "${HF_RESERVA:-}" ] && echo "HF_RESERVA=${HF_RESERVA}"; } || true
                { [ -n "${DISPAROS_HF:-}" ] && echo "DISPAROS_HF=${DISPAROS_HF}"; } || true
                { [ -n "${DISPAROS_HF_SEM_HISTORICO:-}" ] && echo "DISPAROS_HF_SEM_HISTORICO=${DISPAROS_HF_SEM_HISTORICO}"; } || true
              } > .env.secrets
              rm -f .env.secrets.tmp
              # Nunca imprime o token: só se ele existe, e o estado das chaves de comportamento.
              echo "→ HF: token=$([ -n "${HF_TOKEN:-}" ] && echo sim || echo '(vale o .env)') reserva=${HF_RESERVA:-'(default)'} disparos=${DISPAROS_HF:-'(off)'}"
            else
              echo "→ HF: nada nos Secrets/Variables — vale o .env do VPS"
            fi

            # #686: Resend (o código de entrar por e-mail). Só com a chave preenchida: linha vazia apagaria a do .env.
            if [ -n "${RESEND_API_KEY:-}" ]; then
              grep -vE '^(RESEND_API_KEY|EMAIL_FROM)=' .env.secrets > .env.secrets.tmp || true
              {
                cat .env.secrets.tmp
                echo "RESEND_API_KEY=${RESEND_API_KEY}"
                { [ -n "${EMAIL_FROM:-}" ] && echo "EMAIL_FROM=${EMAIL_FROM}"; } || true
              } > .env.secrets
              rm -f .env.secrets.tmp
              echo "→ Resend: chave dos Secrets gravada no .env.secrets"
            else
              echo "→ Resend: Secret vazio — vale o .env do VPS"
            fi

            # PUSHER server-only (APP_ID + SECRET). Mesmo molde do Resend: só grava com valor, porque
            # linha vazia APAGARIA a que já está no .env do VPS — e aí o tempo real cairia em vez de
            # subir. O par público (KEY/CLUSTER) não entra aqui: é build-arg, vai pelo laço de flags.
            if [ -n "${PUSHER_APP_ID:-}" ] && [ -n "${PUSHER_SECRET:-}" ]; then
              grep -vE '^(PUSHER_APP_ID|PUSHER_SECRET)=' .env.secrets > .env.secrets.tmp || true
              {
                cat .env.secrets.tmp
                echo "PUSHER_APP_ID=${PUSHER_APP_ID}"
                echo "PUSHER_SECRET=${PUSHER_SECRET}"
              } > .env.secrets
              rm -f .env.secrets.tmp
              echo "→ Pusher: APP_ID + SECRET dos Secrets gravados no .env.secrets"
            else
              echo "→ Pusher: Secrets vazios — vale o .env do VPS (sem eles, colaboração no poll de 6 s)"
            fi

            # Serviços do deploy: enxuto por padrão; completo se WITH_VOICE=true.
            if [ "$WITH_VOICE" = "true" ]; then
              SERVICES=""            # vazio = todos do compose
              NODEPS=""
            else
              SERVICES="redis caddy web colyseus searxng"   # colyseus = realtime do cyberespaço (leve, 256m); searxng = busca web (512m)
              NODEPS="--no-deps"     # não puxa voice-engine/abnt (glutões)
            fi
            # Fatia 7: o Leitor (perfil "chores") — nomeado, o compose habilita o perfil.
            # O LEITOR SOBE SEMPRE (antes: só com CHORES_QUEUE=1). O web agora anuncia `abrir_url`
            # quando tem URL+allowlist, e anunciar a capacidade com o proxy DESLIGADO é a mentira
            # que a F0 existe pra impedir. São 128 MB, read-only, cap_drop ALL.
            if [ -n "$SERVICES" ]; then
              SERVICES="$SERVICES leitor-proxy"
              echo "→ leitor-proxy entra no deploy (abrir_url/baixar_para_base dependem dele)"
            fi

            # F9: o AGENTE DE NAVEGADOR (perfil "agente") — só quando AGENTIC_MODE está ligada.
            # Diferente do Leitor, que sobe sempre: com a flag off a tela /agente nem existe, então
            # o container seria 1,5 GB de limite reservado pra nada. Com a flag ON ele TEM de subir,
            # porque o web aponta pra ele por default — e anunciar a capacidade com o serviço parado
            # é a mentira que a F0 existe pra impedir (o recibo sonda e diria INALCANÇÁVEL).
            #
            # As DUAS ramificações, porque elas se comportam ao contrário: na lista NOMEADA basta
            # acrescentar o serviço (o compose habilita o perfil dele); na lista VAZIA
            # (WITH_VOICE=true = "todos os sem-perfil") um serviço COM perfil não entra, e é preciso
            # ligar o perfil por COMPOSE_PROFILES. Foi assim que o bloco dos chips resolveu o mesmo
            # problema. (Nota: o bloco do leitor-proxy acima só cobre a ramificação nomeada — com
            # WITH_VOICE=true o Leitor não sobe. Pré-existente, não mexido aqui.)
            case "$(printf '%s' "${AGENTIC_MODE:-}" | tr 'A-Z' 'a-z')" in
              1|true|on)
                if [ -n "$SERVICES" ]; then SERVICES="$SERVICES agente-navegador"
                else export COMPOSE_PROFILES="${COMPOSE_PROFILES:+$COMPOSE_PROFILES,}agente"; fi
                echo "→ agente-navegador entra no deploy (AGENTIC_MODE on; Chromium FORA do web)"
                ;;
              *) echo "→ agente-navegador NÃO sobe (AGENTIC_MODE off)" ;;
            esac

            # Chips de WhatsApp (docs/WHATSAPP_CHIPS.md): WHATSAPP_CHIPS=1 no .env do VPS sobe o adapter + o banco dele
            # (nomeados, o compose habilita o perfil "whatsapp"). A imagem do adapter é construída na VPS (runbook).
            # Dois modos: lista nomeada (enxuto) → acrescenta os serviços; lista VAZIA (WITH_VOICE=true = "todos sem
            # perfil") → liga só o perfil "chips" (24/10: no modo vazio o bloco antigo não fazia nada e o adapter não subiu).
            if grep -Eq "^WHATSAPP_CHIPS=\"?1" .env 2>/dev/null; then
              if [ -n "$SERVICES" ]; then SERVICES="$SERVICES wa-db wa-adapter"
              else export COMPOSE_PROFILES="${COMPOSE_PROFILES:+$COMPOSE_PROFILES,}chips"; fi
              echo "→ WHATSAPP_CHIPS=1: wa-db + wa-adapter entram no deploy"
            fi

            # O Caddy quebra com "a,b" e aceita "a, b". Normaliza o que vier da
            # Variable pra que um esquecimento de espaço não derrube o HTTPS.
            BETA_DOMAIN="$(printf '%s' "$BETA_DOMAIN" | sed 's/[[:space:]]*,[[:space:]]*/, /g')"
            export BETA_DOMAIN
            echo "→ Hostnames do Caddy: $BETA_DOMAIN"

            # Flags do escritório: só exporta o que veio preenchido (string vazia no shell
            # SOBRESCREVERIA o .env do compose e viraria o default 0).
            for k in NEXT_PUBLIC_ESCRITORIO_COWORK NEXT_PUBLIC_AGENTS_ADMIN NEXT_PUBLIC_AGENT_AVATARS NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM NEXT_PUBLIC_MAP_HARNESS NEXT_PUBLIC_CHAT_UNICO TCC_CROSS NEXT_PUBLIC_TCC_CROSS CHAT_BG NEXT_PUBLIC_LOUNGE_3D NEXT_PUBLIC_CYBER_AVATAR_GLB NEXT_PUBLIC_CYBER_LANDMARKS NEXT_PUBLIC_AURA_ECONOMY NEXT_PUBLIC_REALTIME NEXT_PUBLIC_VOZ NEXT_PUBLIC_MOBILE_UI NEXT_PUBLIC_PROJETOS NEXT_PUBLIC_MENTORES_TAB NEXT_PUBLIC_OCTA_CODE NEXT_PUBLIC_OCTA_REA MAP_HARNESS CHAT_UNICO DOC_POR_SECAO ESTUDO_GATEKEEPER AURA_ECONOMY NEXT_PUBLIC_BLUEPRINT_PRATICO BLUEPRINT_PRATICO NEXT_PUBLIC_VIDEO_DOC VIDEO_DOC NEXT_PUBLIC_REA_BLUEPRINT REA_BLUEPRINT HARNESS_CAPACIDADE HARNESS_ACAO HARNESS_VOLTAS_ACAO PRO_PESADAS HARNESS_ANEXO HARNESS_SINTESE HARNESS_GRAFICO MCP_CONECTORES AGENTIC_MODE AGENTE_URL NEXT_PUBLIC_PUSHER_KEY NEXT_PUBLIC_PUSHER_CLUSTER RACIOCINIO_ELABORADO SCHOLAR_WORKER CANAL_WORKER CHORES_WORKER CANAL_QUEUE LEITOR_PROXY_URL LEITOR_ALLOW LEITOR_MAX_BYTES LEITOR_MAX_BYTES_BIN; do
              if [ -n "${!k:-}" ]; then export "$k"; echo "→ flag de build $k=${!k}"; else unset "$k"; fi
            done
            # token do GitHub do blueprint (Secret GITHUB_TOKEN_BLUEPRINT — o prefixo GITHUB_ é reservado nos Secrets): opcional
            if [ -n "${GITHUB_TOKEN_BLUEPRINT:-}" ]; then export GITHUB_TOKEN="$GITHUB_TOKEN_BLUEPRINT"; fi

            # F10c · O DEFAULT MORA AQUI, não na expressão do Actions (ver a nota na env acima).
            if [ -z "${AGENTE_ALLOW:-}" ]; then AGENTE_ALLOW='*'; fi
            export AGENTE_ALLOW
            # ABERTA = existe uma ENTRADA que é exatamente `*` — não "a string contém asterisco",
            # que diria "INTERNET ABERTA" pra `*.edu.br`, uma lista RESTRITA. E `set -f` (noglob) é
            # OBRIGATÓRIO: sem ele o `$AGENTE_ALLOW` sem quotes sofre expansão de caminho e um `*`
            # sozinho vira a lista de arquivos do diretório. Os dois defeitos foram meus na F10 e os
            # dois só apareceram EXECUTANDO o bloco com valores reais.
            AGENTE_ABERTA=0
            _ifs="$IFS"; IFS=','; set -f
            for _d in ${AGENTE_ALLOW}; do
              case "$(printf '%s' "$_d" | tr -d '[:space:]')" in "*") AGENTE_ABERTA=1 ;; esac
            done
            set +f; IFS="$_ifs"; unset _ifs _d
            if [ "$AGENTE_ABERTA" = "1" ]; then
              echo "→ agente: INTERNET ABERTA (IP privado/loopback/metadados seguem bloqueados)"
            else
              echo "→ agente: allowlist restrita (lista nomeada)"
            fi

            echo "→ Subindo containers (coexist: não toca outras stacks)…"
            $DC up -d --build $NODEPS $SERVICES
            # web é runtime-only p/ a credencial → recria pra recarregar .env.secrets
            $DC up -d --force-recreate --no-deps web
            # #645: o WORKER (perfil "worker": turnos do Escritório/chat na fila) é a mesma imagem do web, mas não está
            # na lista do deploy — se ele estiver de pé, ficava rodando o código ANTIGO (ex.: a resposta de quem saiu da
            # conversa continuava entrando). Ligado → reconstrói e recria junto; desligado → não sobe nada novo.
            if docker ps --format '{{.Names}}' | grep -qx zaeon_worker; then
              echo "→ Worker: atualizando junto com o web…"
              $DC --profile worker up -d --build --force-recreate --no-deps worker
            else
              echo "→ Worker: não está rodando (turnos no web)"
            fi
            # LiteLLM (gateway): não está na lista do deploy e só lê infra/litellm.config.yaml AO SUBIR — trocar
            # um grupo de modelo (ex.: zaeon-local-lfm2, 2026-10-22) não valia até alguém reiniciar à mão. Recria
            # quando o config OU a definição dele no compose (limite de memória, envs) mudam; senão não encosta
            # (recriar derruba o gateway por alguns segundos). A impressão digital fica em .litellm-deploy.sha.
            if docker ps --format '{{.Names}}' | grep -qx zaeon_litellm; then
              LITELLM_SHA="$( { cat infra/litellm.config.yaml; $DC config litellm 2>/dev/null; } | sha256sum | cut -d' ' -f1 )"
              if [ "$(cat .litellm-deploy.sha 2>/dev/null)" != "$LITELLM_SHA" ]; then
                echo "→ LiteLLM: config/compose mudou — recriando o gateway…"
                if $DC up -d --force-recreate --no-deps litellm; then
                  echo "$LITELLM_SHA" > .litellm-deploy.sha
                  for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' zaeon_litellm 2>/dev/null)" = healthy ] && break; sleep 3; done
                  echo "  ✓ LiteLLM: $(docker inspect -f '{{.State.Health.Status}}' zaeon_litellm 2>/dev/null)"
                else
                  echo "::warning::não deu pra recriar o LiteLLM — segue com o config antigo"
                fi
              else
                echo "→ LiteLLM: config igual, não mexe"
              fi
            fi
            # o volume dos arquivos gravados pelo app (/app/.studio) nasceu como root, mas o app roda como `zaeon`:
            # acerta o dono a cada deploy (idempotente) — sem isso, salvar música/podcast/imagem dava 500 (EACCES)
            $DC exec -T -u root web sh -c 'mkdir -p /app/.studio && chown -R zaeon:zaeon /app/.studio' \
              && echo "  ✓ /app/.studio gravável pelo app" || echo "::warning::não deu pra acertar o dono de /app/.studio"

            if [ "$DB_PUSH" = "true" ]; then
              echo "→ prisma db push (schema no Atlas; dados intactos)…"
              # --skip-generate: o client já vem do build; sem isso o Prisma tenta
              # regenerar dentro do container e falha com EACCES em node_modules,
              # o que (com set -e) derrubaria o deploy à toa.
              $DC exec -T web npx prisma db push --skip-generate
            fi

            echo "→ Health-gate…"
            ok=0
            for i in $(seq 1 20); do
              if $DC exec -T web node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                ok=1; echo "  ✓ /api/health OK"; break
              fi
              echo "  … aguardando web ($i/20)"; sleep 6
            done
            if [ "$ok" != "1" ]; then
              echo "::error::web não respondeu /api/health — mostrando logs e abortando."
              $DC logs --tail=60 web
              exit 1
            fi

            # RECIBO DO HARNESS no log do deploy (pedido do dono: "confirma no log do deploy").
            # Lê do /api/health DENTRO do container, ou seja: o estado EFETIVO que o turno vai usar,
            # não o que as Variables dizem. Sem isto, "tudo ON" seria só uma afirmação minha — e o
            # loop anterior ("→ flag de build X=…") só imprime flag que TEM Variable, então o padrão
            # do código (que é como as F0–F4 ligam) não apareceria em lugar nenhum.
            echo "→ Harness (estado efetivo no container):"
            $DC exec -T web node -e "
              fetch('http://localhost:3000/api/health').then(r=>r.json()).then(h=>{
                const c = h.capacidades || {};
                const sn = (v) => (v === true ? 'ON' : v === false ? 'off' : String(v));
                console.log('   cardapio=' + sn(c.cardapio) + '  acao=' + sn(c.acao) + '(' + sn(c.voltas) + ' voltas)' +
                            '  anexo=' + sn(c.anexo) + '  sintese=' + sn(c.sintese) + '  doc_por_secao=' + sn(c.docPorSecao) + '  grafico=' + sn(c.grafico));
                console.log('   abrir_url=' + sn(c.abrirUrl) + '  baixar_para_base=' + sn(c.baixarParaBase) +
                            '  leitor=' + h.leitor + '  mcp=' + h.mcp + '  commit=' + String(h.commit).slice(0,12));
                // F6 · o teto de voltas é POR TAREFA. A linha de cima mostra o padrão de quem não
                // passa tarefa (2); sem esta, o recibo diria '2 voltas' enquanto um pedido de
                // trabalho roda 5 — recibo que mente (§8.4b).
                const vt = c.voltasPorTarefa || {};
                if (Object.keys(vt).length) console.log('   voltas por tarefa: ' + Object.keys(vt).map(k => k + '=' + vt[k]).join('  '));
                const m = h.modelo || {};
                if (m.flash) console.log('   modelo: flash=' + m.flash + '  pro=' + m.pro +
                            '  pro_nas_pesadas=' + sn(m.proPesadas) + (m.proSoPlusEPro ? ' (só plus/pro)' : ''));
                // o tempo real do documento: 'on', ou os NOMES das envs que faltam (nunca os valores)
                const tr = h.tempoReal;
                if (tr) console.log('   tempo_real(pusher): ' + (tr === 'on' ? 'on' : 'off — faltam ' + (tr.faltando || []).join(', ')));
                // O TRILHO DO DOCUMENTO, nas duas metades: servidor (pode nascer) e cliente (aparece).
                // Divergência aqui é a falha invisível — documento que nasce e ninguém vê.
                const d = h.documento;
                if (d) console.log('   documento: servidor=' + sn(d.servidor) + '  cliente=' + sn(d.cliente) +
                            '  chat_unico=' + sn(d.chatUnico) + (d.servidor !== d.cliente ? '   ⚠ METADES DIVERGENTES' : ''));
                // F8 · o agente de navegador: 'on' ou os NOMES do que falta. Três condições de
                // naturezas diferentes (flag, allowlist, binário) — ver a nota no /api/health.
                const ag = h.agente;
                if (ag) {
                  if (ag.faltando) console.log('   agente_navegador: off — faltam ' + ag.faltando.join(', '));
                  else console.log('   agente_navegador: on (admin, somente leitura) · onde=' + ag.onde +
                              (ag.onde === 'container' && !ag.alcancavel ? '   ⚠ CONTAINER INALCANÇÁVEL (sobe o serviço)' : ''));
                }
              }).catch(e=>{ console.log('   (não deu pra ler: ' + e.message + ')'); });
            " || echo "::warning::não deu pra imprimir o estado do harness"

            # A ENTRADA, não só o veredito. O recibo acima diz o que o MCP VIROU; sem o valor que o
            # container recebeu, `mcp=off` não distingue "ninguém pediu conector" de "pediram e não
            # funcionou" — e eu perdi um deploy inteiro por causa dessa ambiguidade. Duas linhas que
            # teriam respondido na hora: a env como o processo a vê, e o que o boot logou.
            echo "   MCP_CONECTORES(no container)='$($DC exec -T web printenv MCP_CONECTORES 2>/dev/null | tr -d '\r' || true)'"
            if $DC logs --tail=400 web 2>/dev/null | grep -q '\[mcp\]'; then
              $DC logs --tail=400 web 2>/dev/null | grep '\[mcp\]' | tail -5 | sed 's/^/   /'
            else
              echo "   (boot não logou [mcp] — ligarMcp não foi chamado neste processo)"
            fi

            # O Caddyfile entra MONTADO como ARQUIVO (./Caddyfile:/etc/caddy/Caddyfile:ro). Duas armadilhas:
            #  1) `up -d` não recria o caddy quando só o conteúdo muda, e o Caddy só lê a config na partida;
            #  2) o `git reset --hard` acima troca o arquivo por um NOVO (outro inode) — e o bind mount de
            #     arquivo fica preso ao inode ANTIGO: o container segue vendo a versão velha, então nem um
            #     `caddy reload` resolve (foi o que aconteceu na #266: reload "ok", /colyseus ainda 404).
            # Então: se o que o container enxerga difere do repo, RECRIA o caddy (remonta o arquivo; os
            # certificados ficam no volume caddy_data). Igual → só um reload (barato, sem queda).
            echo "→ Config do Caddy…"
            HOST_SHA="$(sha256sum Caddyfile | cut -d' ' -f1)"
            CONT_SHA="$($DC exec -T caddy sha256sum /etc/caddy/Caddyfile 2>/dev/null | cut -d' ' -f1 || true)"
            if [ "$HOST_SHA" != "$CONT_SHA" ] && ! $DC run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1; then
              # Config nova INVÁLIDA: recriar derrubaria o site (o Caddy não sobe). Fica o que está rodando.
              echo "::error::Caddyfile do repo é inválido (caddy validate) — o caddy NÃO foi recriado"
              $DC run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tail -3 || true
            elif [ "$HOST_SHA" != "$CONT_SHA" ]; then
              echo "  Caddyfile do container está velho (${CONT_SHA:0:12} ≠ ${HOST_SHA:0:12}) → recriando o caddy"
              $DC up -d --force-recreate --no-deps caddy
              sleep 3
              CONT_SHA="$($DC exec -T caddy sha256sum /etc/caddy/Caddyfile 2>/dev/null | cut -d' ' -f1 || true)"
              [ "$HOST_SHA" = "$CONT_SHA" ] && echo "  ✓ Caddyfile novo no ar" || echo "::warning::o caddy ainda não vê o Caddyfile do repo"
            elif $DC exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "  ✓ Caddyfile já atualizado (reload)"
            else
              echo "::warning::caddy reload falhou"
            fi

            # Realtime: o Colyseus responde por dentro da rede E pela rota pública do Caddy? (só avisa)
            if $DC exec -T caddy wget -qO- http://colyseus:2567/health >/dev/null 2>&1; then
              echo "  ✓ colyseus de pé (rede interna)"
            else
              echo "::warning::colyseus não respondeu em colyseus:2567/health — veja: $DC logs --tail=40 colyseus"
            fi

            echo "→ Limpando imagens órfãs…"
            docker image prune -f
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            # enchimento de teste do limite do escalar script
            echo "✓ Deploy concluído — Zaeon no ar."
