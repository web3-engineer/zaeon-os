name: Deploy (VPS)

# Deploy autônomo da Zaeon no VPS via SSH — estilo "coexist-prod": sobe a Zaeon
# SEM derrubar outras stacks no mesmo servidor (ex.: ChipFlow/disparos), porque o
# compose é isolado por nome de projeto (name: zaeon-beta) e a gente NÃO usa
# --remove-orphans nem mexe em containers de fora do projeto.
#
# Dispara no push pra main (ignora docs) OU manualmente (workflow_dispatch, com opções).
# Só executa de verdade se os secrets do VPS existirem (guard) — assim não falha à toa.
#
# Blindagens que nasceram do deploy manual de 2026-09-14:
#   • .env.secrets é ESCRITO pelo pipeline a partir do secret base64 → credencial
#     Vertex sempre numa linha só (nunca mais o erro de "@ in variable name").
#   • cria swap de 8G se não existir (a box travou por falta de RAM no build+voz).
#   • sobe só web+redis+caddy por padrão (voice-engine/abnt são glutões de RAM e
#     ficam opcionais — liguem com a var/opção with_voice).
#   • health-gate: o job FALHA e mostra logs se o /api/health não responder.
#
# Secrets (Settings → Secrets and variables → Actions → New repository secret):
#   VPS_HOST                → 75.119.140.97
#   VPS_PORT                → 22
#   VPS_USER                → root
#   VPS_SSH_KEY             → chave PRIVADA SSH (conteúdo completo) com acesso ao VPS
#   DEPLOY_PATH             → /root/zaeon-os
#   GOOGLE_CREDENTIALS_B64  → base64 do JSON do service account (uma linha)
#   GOOGLE_PROJECT_ID_VALUE → id do projeto Google
# Vars opcionais (aba Variables):
#   DEPLOY_COMPOSE          → override do compose (default docker-compose.beta.yml)
#   DEPLOY_WITH_VOICE       → "true" liga voice-engine/abnt/pdf-loader no deploy
#   BETA_DOMAIN             → hostnames do Caddy (vírgula). Default cobre zaeon.com.br,
#                             www e o sslip.io provisório — os três ao mesmo tempo.
#   APP_URL                 → URL pública (default https://75-119-140-97.sslip.io);
#                             vira NEXTAUTH_URL — trocar aqui quando o domínio mudar.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      rebuild:
        description: "Rebuild das imagens (--build)"
        type: boolean
        default: true
      with_voice:
        description: "Subir também voice-engine/abnt/pdf-loader (come RAM)"
        type: boolean
        default: false
      db_push:
        description: "Rodar prisma db push (migra schema no Atlas)"
        type: boolean
        default: true
      deploy_branch:
        description: "Branch a implantar (default main). Ex.: aura/base-coworking-harness p/ testar sem passar pelo main."
        type: string
        default: "main"

concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.VPS_HOST }}" ] && [ -n "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets do VPS ausentes — deploy pulado. Configure VPS_HOST/VPS_SSH_KEY/etc."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GOOGLE_CREDENTIALS_B64: ${{ secrets.GOOGLE_CREDENTIALS_B64 }}
          GOOGLE_PROJECT_ID_VALUE: ${{ secrets.GOOGLE_PROJECT_ID_VALUE }}
          # Bearer do cron diário de evals do Octa (.github/workflows/octa-evals.yml manda o mesmo secret).
          OCTA_CRON_SECRET: ${{ secrets.OCTA_CRON_SECRET }}
          # #641: o Redis do limitador de uso (src/lib/ratelimit). Antes só vivia no `.env` do VPS — trocar a credencial
          # exigia entrar no servidor. Preenchidos, vão pro .env.secrets (que vence o .env); vazios, o .env decide.
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          # Reserva/caminho do Hugging Face (lib/llm/reservaHf). O token NUNCA esteve no pipeline: sem
          # ele no `.env` do VPS, `reservaHfLigada()` é falso e a reserva está DESLIGADA em produção —
          # inclusive nos disparos. Preenchido, vai pro .env.secrets (que vence o .env); vazio, o .env decide.
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # Runtime (não entram no bundle): valem sem rebuild, só recriando o web.
          HF_RESERVA: ${{ vars.HF_RESERVA || '' }}
          DISPAROS_HF: ${{ vars.DISPAROS_HF || '' }}
          DISPAROS_HF_SEM_HISTORICO: ${{ vars.DISPAROS_HF_SEM_HISTORICO || '' }}
          # opções (push usa defaults; dispatch respeita os inputs)
          WITH_VOICE: ${{ github.event.inputs.with_voice || vars.DEPLOY_WITH_VOICE || 'false' }}
          DB_PUSH: ${{ github.event.inputs.db_push || 'true' }}
          # Branch a implantar (push→main; dispatch pode escolher outra, ex.: aura p/ testar).
          DEPLOY_BRANCH: ${{ github.event.inputs.deploy_branch || 'main' }}
          # URL pública do app → vira NEXTAUTH_URL no compose (redirect do Google).
          APP_URL: ${{ vars.APP_URL || 'https://75-119-140-97.sslip.io' }}
          # Hostnames do Caddy. O Caddy exige vírgula + ESPAÇO entre site addresses:
          # 'a,b' derruba o container em loop ("Site addresses cannot contain a comma").
          # Já aconteceu em 26/09 e tirou o HTTPS do ar. O script normaliza os dois
          # formatos antes de subir, mas escreva a Variable com espaço mesmo assim.
          # O default é só o endereço provisório DE PROPÓSITO: pedir certificado pra um
          # domínio que ainda não resolve gasta tentativa de ACME à toa. Quando o DNS do
          # zaeon.com.br subir, setar a Variable BETA_DOMAIN e redeployar — feito em
          # 26/09: hoje ela vale 'zaeon.com.br, 75-119-140-97.sslip.io'. O www fica FORA
          # da lista: tem bloco próprio de redirect no Caddyfile, porque o client OAuth
          # do Google não aceita o callback com www.
          BETA_DOMAIN: ${{ vars.BETA_DOMAIN || '75-119-140-97.sslip.io' }}
          # E-mail do ACME (Let's Encrypt manda aviso de expiração pra cá). O default do
          # compose é um endereço em zaeon.space, domínio que EXPIROU — aviso indo pro vazio.
          ACME_EMAIL: ${{ vars.ACME_EMAIL || '' }}
          # Flags de BUILD do escritório coworking (NEXT_PUBLIC_* entram no bundle: só valem no
          # build). Vêm das Variables do repo (Settings → Variables); vazia = não exporta e o
          # `.env` do VPS (ou o default 0 do compose) decide. Rollback = Variable "0" + redeploy.
          NEXT_PUBLIC_ESCRITORIO_COWORK: ${{ vars.NEXT_PUBLIC_ESCRITORIO_COWORK || '' }}
          NEXT_PUBLIC_AGENTS_ADMIN: ${{ vars.NEXT_PUBLIC_AGENTS_ADMIN || '' }}
          NEXT_PUBLIC_AGENT_AVATARS: ${{ vars.NEXT_PUBLIC_AGENT_AVATARS || '' }}
          # Sala de Pesquisa unificada (mesma mecânica; rollback = Variable "0" + redeploy).
          NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM: ${{ vars.NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM || '' }}
          NEXT_PUBLIC_MAP_HARNESS: ${{ vars.NEXT_PUBLIC_MAP_HARNESS || '' }}
          NEXT_PUBLIC_CHAT_UNICO: ${{ vars.NEXT_PUBLIC_CHAT_UNICO || '' }}
          NEXT_PUBLIC_BLUEPRINT_PRATICO: ${{ vars.NEXT_PUBLIC_BLUEPRINT_PRATICO || '' }}
          NEXT_PUBLIC_VIDEO_DOC: ${{ vars.NEXT_PUBLIC_VIDEO_DOC || '' }}
          NEXT_PUBLIC_LOUNGE_3D: ${{ vars.NEXT_PUBLIC_LOUNGE_3D || '' }}
          NEXT_PUBLIC_MOBILE_UI: ${{ vars.NEXT_PUBLIC_MOBILE_UI || '' }}
          NEXT_PUBLIC_PROJETOS: ${{ vars.NEXT_PUBLIC_PROJETOS || '' }}
          NEXT_PUBLIC_MENTORES_TAB: ${{ vars.NEXT_PUBLIC_MENTORES_TAB || '' }}
          NEXT_PUBLIC_OCTA_CODE: ${{ vars.NEXT_PUBLIC_OCTA_CODE || '' }}
          NEXT_PUBLIC_OCTA_REA: ${{ vars.NEXT_PUBLIC_OCTA_REA || '' }}
          NEXT_PUBLIC_REA_BLUEPRINT: ${{ vars.NEXT_PUBLIC_REA_BLUEPRINT || '' }}
          NEXT_PUBLIC_CYBER_AVATAR_GLB: ${{ vars.NEXT_PUBLIC_CYBER_AVATAR_GLB || '' }}
          NEXT_PUBLIC_CYBER_LANDMARKS: ${{ vars.NEXT_PUBLIC_CYBER_LANDMARKS || '' }}
          NEXT_PUBLIC_AURA_ECONOMY: ${{ vars.NEXT_PUBLIC_AURA_ECONOMY || '' }}
          # realtime do cyberespaço: Variables NEXT_PUBLIC_REALTIME (pusher|colyseus) e NEXT_PUBLIC_VOZ (on|off)
          NEXT_PUBLIC_REALTIME: ${{ vars.NEXT_PUBLIC_REALTIME || '' }}
          NEXT_PUBLIC_VOZ: ${{ vars.NEXT_PUBLIC_VOZ || '' }}
          # Flags de SERVIDOR (runtime): cérebro, gatekeeper, economia AURA.
          MAP_HARNESS: ${{ vars.MAP_HARNESS || '' }}
          CHAT_UNICO: ${{ vars.CHAT_UNICO || '' }}
          BLUEPRINT_PRATICO: ${{ vars.BLUEPRINT_PRATICO || '' }}
          REA_BLUEPRINT: ${{ vars.REA_BLUEPRINT || '' }}
          VIDEO_DOC: ${{ vars.VIDEO_DOC || '' }}
          GITHUB_TOKEN_BLUEPRINT: ${{ secrets.GITHUB_TOKEN_BLUEPRINT || '' }}
          ESTUDO_GATEKEEPER: ${{ vars.ESTUDO_GATEKEEPER || '' }}
          AURA_ECONOMY: ${{ vars.AURA_ECONOMY || '' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          envs: GOOGLE_CREDENTIALS_B64,GOOGLE_PROJECT_ID_VALUE,OCTA_CRON_SECRET,UPSTASH_REDIS_REST_URL,UPSTASH_REDIS_REST_TOKEN,HF_TOKEN,HF_RESERVA,DISPAROS_HF,DISPAROS_HF_SEM_HISTORICO,WITH_VOICE,DB_PUSH,DEPLOY_BRANCH,APP_URL,BETA_DOMAIN,ACME_EMAIL,NEXT_PUBLIC_ESCRITORIO_COWORK,NEXT_PUBLIC_AGENTS_ADMIN,NEXT_PUBLIC_AGENT_AVATARS,NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM,NEXT_PUBLIC_MAP_HARNESS,NEXT_PUBLIC_LOUNGE_3D,NEXT_PUBLIC_CYBER_AVATAR_GLB,NEXT_PUBLIC_CYBER_LANDMARKS,NEXT_PUBLIC_AURA_ECONOMY,NEXT_PUBLIC_REALTIME,NEXT_PUBLIC_VOZ,NEXT_PUBLIC_MOBILE_UI,NEXT_PUBLIC_PROJETOS,NEXT_PUBLIC_MENTORES_TAB,NEXT_PUBLIC_OCTA_CODE,NEXT_PUBLIC_OCTA_REA,MAP_HARNESS,ESTUDO_GATEKEEPER,AURA_ECONOMY,NEXT_PUBLIC_CHAT_UNICO,CHAT_UNICO,NEXT_PUBLIC_BLUEPRINT_PRATICO,BLUEPRINT_PRATICO,GITHUB_TOKEN_BLUEPRINT,NEXT_PUBLIC_VIDEO_DOC,VIDEO_DOC,NEXT_PUBLIC_REA_BLUEPRINT,REA_BLUEPRINT
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            export COMPOSE_FILE="${{ vars.DEPLOY_COMPOSE || 'docker-compose.beta.yml' }}"
            DC="docker compose -f $COMPOSE_FILE"
            echo "→ Compose: $COMPOSE_FILE   with_voice=$WITH_VOICE   db_push=$DB_PUSH"

            echo "→ Swap (blindagem de RAM)…"
            if ! swapon --show | grep -q /swapfile; then
              fallocate -l 8G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
              grep -q /swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
              echo "  swap de 8G criado."
            else
              echo "  swap já existe."
            fi

            echo "→ Atualizando código (branch: ${DEPLOY_BRANCH})…"
            git fetch --all --prune
            git reset --hard "origin/${DEPLOY_BRANCH}"
            export GIT_SHA="$(git rev-parse --short HEAD)"
            echo "-> Commit no deploy: $GIT_SHA"

            echo "→ Gravando .env.secrets (credencial Vertex em UMA linha)…"
            umask 177
            if [ -n "${GOOGLE_CREDENTIALS_B64:-}" ]; then
              {
                echo "GOOGLE_CREDENTIALS=$(printf '%s' "$GOOGLE_CREDENTIALS_B64" | base64 -d | tr -d '\n')"
                echo "GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID_VALUE}"
                if [ -n "${OCTA_CRON_SECRET:-}" ]; then echo "OCTA_CRON_SECRET=${OCTA_CRON_SECRET}"; fi
              } > .env.secrets
            else
              echo "::warning::GOOGLE_CREDENTIALS_B64 vazio — mantendo .env.secrets atual (se houver)."
              touch .env.secrets
            fi
            # #641: Upstash (limitador de uso) a partir dos Secrets — troca as linhas antigas, mantém o resto do arquivo.
            # Só com os DOIS preenchidos (meio par = Redis quebrado; aí o .env do VPS continua valendo).
            if [ -n "${UPSTASH_REDIS_REST_URL:-}" ] && [ -n "${UPSTASH_REDIS_REST_TOKEN:-}" ]; then
              grep -v '^UPSTASH_REDIS_REST_' .env.secrets > .env.secrets.tmp || true
              {
                cat .env.secrets.tmp
                echo "UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL}"
                echo "UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN}"
              } > .env.secrets
              rm -f .env.secrets.tmp
              echo "→ Upstash: credencial dos Secrets gravada no .env.secrets"
            else
              echo "→ Upstash: Secrets vazios — vale o .env do VPS"
            fi
            # HF: o token é SECRET (vai pro .env.secrets); as três chaves de comportamento são Variables
            # e entram no mesmo arquivo pra valerem sem rebuild. Cada uma só é gravada se vier preenchida —
            # linha vazia aqui SOBRESCREVERIA o `.env` do VPS e desligaria o que já estava ligado.
            if [ -n "${HF_TOKEN:-}" ] || [ -n "${HF_RESERVA:-}" ] || [ -n "${DISPAROS_HF:-}" ] || [ -n "${DISPAROS_HF_SEM_HISTORICO:-}" ]; then
              grep -vE '^(HF_TOKEN|HF_RESERVA|DISPAROS_HF|DISPAROS_HF_SEM_HISTORICO)=' .env.secrets > .env.secrets.tmp || true
              {
                cat .env.secrets.tmp
                # `|| true` em cada uma: o script roda com `set -e`, e um teste falso sem isso
                # devolveria 1 e derrubaria o deploy justamente quando a chave está vazia.
                { [ -n "${HF_TOKEN:-}" ] && echo "HF_TOKEN=${HF_TOKEN}"; } || true
                { [ -n "${HF_RESERVA:-}" ] && echo "HF_RESERVA=${HF_RESERVA}"; } || true
                { [ -n "${DISPAROS_HF:-}" ] && echo "DISPAROS_HF=${DISPAROS_HF}"; } || true
                { [ -n "${DISPAROS_HF_SEM_HISTORICO:-}" ] && echo "DISPAROS_HF_SEM_HISTORICO=${DISPAROS_HF_SEM_HISTORICO}"; } || true
              } > .env.secrets
              rm -f .env.secrets.tmp
              # Nunca imprime o token: só se ele existe, e o estado das chaves de comportamento.
              echo "→ HF: token=$([ -n "${HF_TOKEN:-}" ] && echo sim || echo '(vale o .env)') reserva=${HF_RESERVA:-'(default)'} disparos=${DISPAROS_HF:-'(off)'}"
            else
              echo "→ HF: nada nos Secrets/Variables — vale o .env do VPS"
            fi

            # Serviços do deploy: enxuto por padrão; completo se WITH_VOICE=true.
            if [ "$WITH_VOICE" = "true" ]; then
              SERVICES=""            # vazio = todos do compose
              NODEPS=""
            else
              SERVICES="redis caddy web colyseus searxng"   # colyseus = realtime do cyberespaço (leve, 256m); searxng = busca web (512m)
              NODEPS="--no-deps"     # não puxa voice-engine/abnt (glutões)
            fi
            # Fatia 7: com CHORES_QUEUE=1 no .env do VPS, o Leitor (perfil "chores") sobe junto — nomeado, o compose habilita o perfil.
            if [ -n "$SERVICES" ] && grep -Eq "^CHORES_QUEUE=\"?1" .env 2>/dev/null; then
              SERVICES="$SERVICES leitor-proxy"
              echo "→ CHORES_QUEUE=1: leitor-proxy entra no deploy"
            fi

            # Chips de WhatsApp (docs/WHATSAPP_CHIPS.md): WHATSAPP_CHIPS=1 no .env do VPS sobe o adapter + o banco dele
            # (nomeados, o compose habilita o perfil "whatsapp"). A imagem do adapter é construída na VPS (runbook).
            # Dois modos: lista nomeada (enxuto) → acrescenta os serviços; lista VAZIA (WITH_VOICE=true = "todos sem
            # perfil") → liga só o perfil "chips" (24/10: no modo vazio o bloco antigo não fazia nada e o adapter não subiu).
            if grep -Eq "^WHATSAPP_CHIPS=\"?1" .env 2>/dev/null; then
              if [ -n "$SERVICES" ]; then SERVICES="$SERVICES wa-db wa-adapter"
              else export COMPOSE_PROFILES="${COMPOSE_PROFILES:+$COMPOSE_PROFILES,}chips"; fi
              echo "→ WHATSAPP_CHIPS=1: wa-db + wa-adapter entram no deploy"
            fi

            # O Caddy quebra com "a,b" e aceita "a, b". Normaliza o que vier da
            # Variable pra que um esquecimento de espaço não derrube o HTTPS.
            BETA_DOMAIN="$(printf '%s' "$BETA_DOMAIN" | sed 's/[[:space:]]*,[[:space:]]*/, /g')"
            export BETA_DOMAIN
            echo "→ Hostnames do Caddy: $BETA_DOMAIN"

            # Flags do escritório: só exporta o que veio preenchido (string vazia no shell
            # SOBRESCREVERIA o .env do compose e viraria o default 0).
            for k in NEXT_PUBLIC_ESCRITORIO_COWORK NEXT_PUBLIC_AGENTS_ADMIN NEXT_PUBLIC_AGENT_AVATARS NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM NEXT_PUBLIC_MAP_HARNESS NEXT_PUBLIC_CHAT_UNICO NEXT_PUBLIC_LOUNGE_3D NEXT_PUBLIC_CYBER_AVATAR_GLB NEXT_PUBLIC_CYBER_LANDMARKS NEXT_PUBLIC_AURA_ECONOMY NEXT_PUBLIC_REALTIME NEXT_PUBLIC_VOZ NEXT_PUBLIC_MOBILE_UI NEXT_PUBLIC_PROJETOS NEXT_PUBLIC_MENTORES_TAB NEXT_PUBLIC_OCTA_CODE NEXT_PUBLIC_OCTA_REA MAP_HARNESS CHAT_UNICO ESTUDO_GATEKEEPER AURA_ECONOMY NEXT_PUBLIC_BLUEPRINT_PRATICO BLUEPRINT_PRATICO NEXT_PUBLIC_VIDEO_DOC VIDEO_DOC NEXT_PUBLIC_REA_BLUEPRINT REA_BLUEPRINT; do
              if [ -n "${!k:-}" ]; then export "$k"; echo "→ flag de build $k=${!k}"; else unset "$k"; fi
            done
            # token do GitHub do blueprint (Secret GITHUB_TOKEN_BLUEPRINT — o prefixo GITHUB_ é reservado nos Secrets): opcional
            if [ -n "${GITHUB_TOKEN_BLUEPRINT:-}" ]; then export GITHUB_TOKEN="$GITHUB_TOKEN_BLUEPRINT"; fi

            echo "→ Subindo containers (coexist: não toca outras stacks)…"
            $DC up -d --build $NODEPS $SERVICES
            # web é runtime-only p/ a credencial → recria pra recarregar .env.secrets
            $DC up -d --force-recreate --no-deps web
            # #645: o WORKER (perfil "worker": turnos do Escritório/chat na fila) é a mesma imagem do web, mas não está
            # na lista do deploy — se ele estiver de pé, ficava rodando o código ANTIGO (ex.: a resposta de quem saiu da
            # conversa continuava entrando). Ligado → reconstrói e recria junto; desligado → não sobe nada novo.
            if docker ps --format '{{.Names}}' | grep -qx zaeon_worker; then
              echo "→ Worker: atualizando junto com o web…"
              $DC --profile worker up -d --build --force-recreate --no-deps worker
            else
              echo "→ Worker: não está rodando (turnos no web)"
            fi
            # LiteLLM (gateway): não está na lista do deploy e só lê infra/litellm.config.yaml AO SUBIR — trocar
            # um grupo de modelo (ex.: zaeon-local-lfm2, 2026-10-22) não valia até alguém reiniciar à mão. Recria
            # quando o config OU a definição dele no compose (limite de memória, envs) mudam; senão não encosta
            # (recriar derruba o gateway por alguns segundos). A impressão digital fica em .litellm-deploy.sha.
            if docker ps --format '{{.Names}}' | grep -qx zaeon_litellm; then
              LITELLM_SHA="$( { cat infra/litellm.config.yaml; $DC config litellm 2>/dev/null; } | sha256sum | cut -d' ' -f1 )"
              if [ "$(cat .litellm-deploy.sha 2>/dev/null)" != "$LITELLM_SHA" ]; then
                echo "→ LiteLLM: config/compose mudou — recriando o gateway…"
                if $DC up -d --force-recreate --no-deps litellm; then
                  echo "$LITELLM_SHA" > .litellm-deploy.sha
                  for i in $(seq 1 30); do [ "$(docker inspect -f '{{.State.Health.Status}}' zaeon_litellm 2>/dev/null)" = healthy ] && break; sleep 3; done
                  echo "  ✓ LiteLLM: $(docker inspect -f '{{.State.Health.Status}}' zaeon_litellm 2>/dev/null)"
                else
                  echo "::warning::não deu pra recriar o LiteLLM — segue com o config antigo"
                fi
              else
                echo "→ LiteLLM: config igual, não mexe"
              fi
            fi
            # o volume dos arquivos gravados pelo app (/app/.studio) nasceu como root, mas o app roda como `zaeon`:
            # acerta o dono a cada deploy (idempotente) — sem isso, salvar música/podcast/imagem dava 500 (EACCES)
            $DC exec -T -u root web sh -c 'mkdir -p /app/.studio && chown -R zaeon:zaeon /app/.studio' \
              && echo "  ✓ /app/.studio gravável pelo app" || echo "::warning::não deu pra acertar o dono de /app/.studio"

            if [ "$DB_PUSH" = "true" ]; then
              echo "→ prisma db push (schema no Atlas; dados intactos)…"
              # --skip-generate: o client já vem do build; sem isso o Prisma tenta
              # regenerar dentro do container e falha com EACCES em node_modules,
              # o que (com set -e) derrubaria o deploy à toa.
              $DC exec -T web npx prisma db push --skip-generate
            fi

            echo "→ Health-gate…"
            ok=0
            for i in $(seq 1 20); do
              if $DC exec -T web node -e "fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
                ok=1; echo "  ✓ /api/health OK"; break
              fi
              echo "  … aguardando web ($i/20)"; sleep 6
            done
            if [ "$ok" != "1" ]; then
              echo "::error::web não respondeu /api/health — mostrando logs e abortando."
              $DC logs --tail=60 web
              exit 1
            fi

            # O Caddyfile entra MONTADO como ARQUIVO (./Caddyfile:/etc/caddy/Caddyfile:ro). Duas armadilhas:
            #  1) `up -d` não recria o caddy quando só o conteúdo muda, e o Caddy só lê a config na partida;
            #  2) o `git reset --hard` acima troca o arquivo por um NOVO (outro inode) — e o bind mount de
            #     arquivo fica preso ao inode ANTIGO: o container segue vendo a versão velha, então nem um
            #     `caddy reload` resolve (foi o que aconteceu na #266: reload "ok", /colyseus ainda 404).
            # Então: se o que o container enxerga difere do repo, RECRIA o caddy (remonta o arquivo; os
            # certificados ficam no volume caddy_data). Igual → só um reload (barato, sem queda).
            echo "→ Config do Caddy…"
            HOST_SHA="$(sha256sum Caddyfile | cut -d' ' -f1)"
            CONT_SHA="$($DC exec -T caddy sha256sum /etc/caddy/Caddyfile 2>/dev/null | cut -d' ' -f1 || true)"
            if [ "$HOST_SHA" != "$CONT_SHA" ] && ! $DC run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile >/dev/null 2>&1; then
              # Config nova INVÁLIDA: recriar derrubaria o site (o Caddy não sobe). Fica o que está rodando.
              echo "::error::Caddyfile do repo é inválido (caddy validate) — o caddy NÃO foi recriado"
              $DC run --rm --no-deps -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile 2>&1 | tail -3 || true
            elif [ "$HOST_SHA" != "$CONT_SHA" ]; then
              echo "  Caddyfile do container está velho (${CONT_SHA:0:12} ≠ ${HOST_SHA:0:12}) → recriando o caddy"
              $DC up -d --force-recreate --no-deps caddy
              sleep 3
              CONT_SHA="$($DC exec -T caddy sha256sum /etc/caddy/Caddyfile 2>/dev/null | cut -d' ' -f1 || true)"
              [ "$HOST_SHA" = "$CONT_SHA" ] && echo "  ✓ Caddyfile novo no ar" || echo "::warning::o caddy ainda não vê o Caddyfile do repo"
            elif $DC exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "  ✓ Caddyfile já atualizado (reload)"
            else
              echo "::warning::caddy reload falhou"
            fi

            # Realtime: o Colyseus responde por dentro da rede E pela rota pública do Caddy? (só avisa)
            if $DC exec -T caddy wget -qO- http://colyseus:2567/health >/dev/null 2>&1; then
              echo "  ✓ colyseus de pé (rede interna)"
            else
              echo "::warning::colyseus não respondeu em colyseus:2567/health — veja: $DC logs --tail=40 colyseus"
            fi

            echo "→ Limpando imagens órfãs…"
            docker image prune -f
            echo "✓ Deploy concluído — Zaeon no ar."
