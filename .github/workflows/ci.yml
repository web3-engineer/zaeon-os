name: CI

# Verificação contínua: instala, gera Prisma, lint (não-bloqueante), testes e build.
# O build aqui é a real checagem que o sandbox de dev não consegue rodar (Next build longo).

# Economia de minutos: CI roda só em Pull Requests pra main (não em todo push de
# toda branch). O deploy.yml cuida do push pra main, e o build pesado é no VPS.
# Mudanças só de doc (.md/docs) não disparam o CI.
on:
  pull_request:
    # ready_for_review: PR em rascunho (draft) não gasta CI; ao marcar "Ready for review" ele roda.
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

# Cancela runs antigos do mesmo ref quando chega um push novo.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # Pula rascunhos (draft). Em workflow_dispatch/push não há `pull_request`, então roda.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Postgres + pgvector de verdade pros testes do RAG (lib/rag/*.test.ts, via lib/rag/pgTeste.ts): sem ele os
    # testes de banco (inclusive os de permissão por turma) seriam pulados em silêncio.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # Envs de placeholder só p/ o build não quebrar (sem segredos reais).
    # MONGODB_URI é OBRIGATÓRIA: src/lib/db.ts lança erro no import se faltar, e o
    # `next build` importa todas as rotas → sem ela o build do CI fica vermelho.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL: "mongodb://placeholder:27017/build"
      MONGODB_URI: "mongodb://placeholder:27017/build"
      NEXTAUTH_SECRET: "ci-placeholder-secret-not-used-in-prod"
      NEXTAUTH_URL: "http://localhost:3000"
      RAG_PG_TEST_URL: "postgres://postgres:postgres@localhost:5432/postgres"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prisma validate (falha rapido se o schema estiver invalido)
        run: npx --yes prisma@6 validate
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # i18n: os 7 locales (public/locales) com as MESMAS chaves, variáveis e tags do <Trans>. Sem deps, roda em ~1s.
      - name: Paridade dos locales (i18n)
        run: node scripts/i18n-check.mjs

      # Supply-chain (Pack Octa §1). ANTES do npm ci: pacote novo com install script (ou versão nova) só
      # entra depois de revisado em config/vetting/install-scripts.json; repo REJEITADO não entra nunca.
      - name: Vetting de dependências (lockfile + install scripts + repos rejeitados)
        run: node scripts/vet-deps.mjs

      # `--ignore-scripts`: nenhum postinstall roda antes de a lista acima ser checada; os revisados rodam no rebuild.
      - name: Install deps
        run: |
          npm ci --ignore-scripts
          npm rebuild

      # SCA com catraca: advisory high/critical NOVA nas deps de produção = vermelho. As herdadas estão em
      # config/vetting/audit-baseline.json (pagar aos poucos, nunca acrescentar calado).
      - name: SCA (npm audit, catraca)
        run: node scripts/vet-audit.mjs

      - name: Prisma generate
        run: npx prisma generate

      # Realtime do cyberespaço (Colyseus, server/colyseus): pacote à parte (imagem própria). As deps vêm ANTES do
      # typecheck/vitest da raiz porque o teste de ponta a ponta (lib/lounge3d/salaColyseus.int.test.ts) sobe o
      # servidor de verdade e conecta 2 clientes do site.
      - name: Install deps (realtime Colyseus)
        run: npm ci --prefix server/colyseus

      - name: Lint (não-bloqueante)
        run: npm run lint
        continue-on-error: true

      # BLOQUEANTE, e de proposito. next.config.mjs tem ignoreBuildErrors: true, entao o
      # `next build` passa por cima de QUALQUER erro de tipo — foi assim que um
      # <EscritorioRoom /> sem import chegou em producao e virou "Application error" pro
      # aluno. O tsc pega isso em ~20s; nenhum teste pegaria, porque nao ha teste de render
      # de pagina. Enquanto o ignoreBuildErrors existir, ESTE passo e a unica rede.
      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # A captura do Octa (lib/octa/captura.test.ts) usa o Google Chrome que já vem no runner ubuntu-latest:
      # sem isto os testes de segurança dela (JS off, allowlist, sem navegação) seriam pulados. --no-sandbox
      # pelo mesmo motivo do container (AppArmor do runner barra user namespaces).
      - name: REA proof persistence (isolated Mongo replica set)
        run: |
          docker run -d --name rea-proof-mongo -p 127.0.0.1:27017:27017 mongo:7 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec rea-proof-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})' > /dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec rea-proof-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
          DATABASE_URL='mongodb://127.0.0.1:27017/rea_test?directConnection=true' npx prisma db push --skip-generate
          node --test infra/rea-engine/android-capabilities.test.mjs infra/rea-engine/android-request.test.mjs

      - name: Tests (vitest)
        run: npm test
        env:
          OCTA_CHROMIUM_PATH: /usr/bin/google-chrome
          OCTA_CHROMIUM_SEM_SANDBOX: "1"
          REA_TEST_DATABASE_URL: "mongodb://127.0.0.1:27017/rea_test?directConnection=true"

      - name: Realtime Colyseus — typecheck + testes (sala, token, regras)
        working-directory: server/colyseus
        run: |
          npx tsc -p tsconfig.json --noEmit
          npm test

      # BLOQUEANTE, e de proposito. O abnt-service tinha 41 testes que NINGUEM rodava, e
      # por isso um formatter com 6 nomes indefinidos — um deles no caminho por onde passa
      # todo paragrafo — ficou meses em producao sem gerar um unico documento. O container
      # subia, reiniciava em loop, e o app so dizia "servico ABNT offline". Teste que nao
      # roda no CI nao e rede: e decoracao.
      - name: Setup Python (worker ABNT)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tests (pytest — abnt-service)
        working-directory: abnt-service
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
          pytest -q

      # Itens de lista sumiam dos blocks[] (o opendataloader os guarda em "list items", não em
      # kids) e o RAG nunca os cortava. O _walk é puro: não precisa de Java nem do opendataloader.
      - name: Tests (pytest — pdf-loader)
        working-directory: pdf-loader
        run: |
          pip install -r requirements-dev.txt
          pytest -q

      - name: Build
        run: npx next build
