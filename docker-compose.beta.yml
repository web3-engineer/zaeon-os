# ───────────────────────────────────────────────────────────────────────────
# Compose da BETA — VPS 2 vCPU / 8 GB.  web + redis + caddy + voz + abnt.
#   web (Next + Socket.IO) · redis · caddy (proxy/HTTPS) · voice-engine (Kokoro,
#   CPU-only) · abnt-service (LibreOffice). Voz é gated por perfil no admin.
#
# Mongo é Atlas externo (DATABASE_URL/MONGODB_URI no .env). Sem postgres/agentes/
# observabilidade (isso fica no docker-compose.yml completo, pra depois).
#
# Orçamento de RAM (limites): web 1.5g + voz 1g + abnt 1.2g + redis 0.38g + caddy 0.25g
#   + pdf-loader 0.896g ≈ 5.2g → folga ~2.8g em 8g.
#   Voz padrão = Gemini-TTS (nuvem); voice-engine local só fallback Piper (Kokoro lazy).
#   pdf-loader em modo FAST (sem OCR/Hybrid); ligar Hybrid só com 16 GB.
#
# Subir:   docker compose -f docker-compose.beta.yml up -d --build
# Logs:    docker compose -f docker-compose.beta.yml logs -f web caddy voice-engine
# ───────────────────────────────────────────────────────────────────────────

name: zaeon-beta

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      # NEXT_PUBLIC_* são embutidas no build → vêm do .env como build-args.
      # (PUSHER_SECRET NÃO entra aqui; é server-only, fica só no env_file de runtime.)
      args:
        NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
        NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
        NEXT_PUBLIC_ESCRITORIO_COWORK: ${NEXT_PUBLIC_ESCRITORIO_COWORK:-0}
        NEXT_PUBLIC_AGENTS_ADMIN: ${NEXT_PUBLIC_AGENTS_ADMIN:-0}
        NEXT_PUBLIC_AGENT_AVATARS: ${NEXT_PUBLIC_AGENT_AVATARS:-0}
        NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM: ${NEXT_PUBLIC_UNIFIED_RESEARCH_ROOM:-0}
        NEXT_PUBLIC_MAP_HARNESS: ${NEXT_PUBLIC_MAP_HARNESS:-0}
        NEXT_PUBLIC_CHAT_UNICO: ${NEXT_PUBLIC_CHAT_UNICO:-0}
        NEXT_PUBLIC_TCC_CROSS: ${NEXT_PUBLIC_TCC_CROSS:-0}
        NEXT_PUBLIC_BLUEPRINT_PRATICO: ${NEXT_PUBLIC_BLUEPRINT_PRATICO:-0}
        NEXT_PUBLIC_VIDEO_DOC: ${NEXT_PUBLIC_VIDEO_DOC:-0}
        NEXT_PUBLIC_LOUNGE_3D: ${NEXT_PUBLIC_LOUNGE_3D:-0}
        NEXT_PUBLIC_MOBILE_UI: ${NEXT_PUBLIC_MOBILE_UI:-0}
        NEXT_PUBLIC_PROJETOS: ${NEXT_PUBLIC_PROJETOS:-0}
        NEXT_PUBLIC_MENTORES_TAB: ${NEXT_PUBLIC_MENTORES_TAB:-0}   # PR-A2: /mentores + loja com "Mentores" primeiro
        NEXT_PUBLIC_OCTA_CODE: ${NEXT_PUBLIC_OCTA_CODE:-}          # Octa: /octa/saude + /api/octa/evals/run ("1" liga)
        NEXT_PUBLIC_REA_BLUEPRINT: ${NEXT_PUBLIC_REA_BLUEPRINT:-0}      # Blueprint REA no chat + aba Sala de Estudos ("1" liga)
        NEXT_PUBLIC_CYBER_AVATAR_GLB: ${NEXT_PUBLIC_CYBER_AVATAR_GLB:-}
        NEXT_PUBLIC_CYBER_LANDMARKS: ${NEXT_PUBLIC_CYBER_LANDMARKS:-}
        NEXT_PUBLIC_AURA_ECONOMY: ${NEXT_PUBLIC_AURA_ECONOMY:-0}
        # realtime do cyberespaço (docs/REALTIME_COLYSEUS_VOZ.md): pusher (padrão) | colyseus; voz on|off
        NEXT_PUBLIC_REALTIME: ${NEXT_PUBLIC_REALTIME:-pusher}
        NEXT_PUBLIC_VOZ: ${NEXT_PUBLIC_VOZ:-off}
        NEXT_PUBLIC_COLYSEUS_URL: ${NEXT_PUBLIC_COLYSEUS_URL:-}
    container_name: zaeon_web
    # .env = base (vive no VPS). .env.secrets = segredos de runtime escritos pelo
    # deploy a partir dos GitHub Actions secrets (ex.: GOOGLE_CREDENTIALS). O último vence.
    env_file: [.env, .env.secrets]
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      NODE_ENV: production
      # Endereço público do app. O Google devolve o usuário no NEXTAUTH_URL: se ele
      # apontar pra um domínio morto, o login quebra mesmo com client_id/secret certos
      # (foi exatamente o que aconteceu com beta.zaeon.space). Trocar de domínio =
      # setar a Variable APP_URL no repo (ou APP_URL no .env do VPS), nada mais.
      NEXTAUTH_URL: ${APP_URL:-https://75-119-140-97.sslip.io}
      NEXT_PUBLIC_APP_URL: ${APP_URL:-https://75-119-140-97.sslip.io}
      REDIS_URL: redis://redis:6379/0
      VOICE_ENGINE_URL: http://voice-engine:8004   # proxy /api/ai/voice
      ABNT_SERVICE_URL: http://abnt-service:8001    # exportação ABNT
      PDF_LOADER_URL: http://pdf-loader:8005        # leitura estruturada de PDF
      # Busca NA INTERNET (tool web_search / fallback da pesquisa): SearXNG self-hosted abaixo. Se o
      # container não estiver de pé, a chamada falha rápido e a IA responde pelo conhecimento do modelo.
      # Tavily/Brave: TAVILY_API_KEY / BRAVE_API_KEY no .env (WEB_SEARCH_PROVIDER força qual usar).
      SEARXNG_URL: http://searxng:8080
      # Sala de Pesquisa em BACKGROUND: o web só ENFILEIRA (SCHOLAR_WORKER=0); quem roda
      # o pipeline até o fim é o serviço `worker` abaixo. Assim, sair da sala não para a
      # pesquisa — o worker continua e o cliente reengata pela sessão no banco.
      # BACKGROUND da Sala de Pesquisa: DESLIGADO por enquanto (modo inline, já testado).
      # Pra ligar: mude SCHOLAR_BG p/ "1" AQUI e suba o worker com `--profile worker`.
      SCHOLAR_BG: "0"
      # Chat da Aura em BACKGROUND (turno salvo no banco: conexão que cai não perde a resposta — o cliente
      # retoma pelo X-Chat-Turn-Id). Vem do .env: CHAT_BG=1 + SCHOLAR_WORKER=1 roda o consumidor da fila
      # "chat" DENTRO do web (sem o serviço `worker`). Deploy que recria o web ainda mata o turno em curso
      # (o reaper marca erro no boot). Default 0 = inline, como antes.
      CHAT_BG: ${CHAT_BG:-0}
      SCHOLAR_WORKER: ${SCHOLAR_WORKER:-0}
      # Flags de SERVIDOR (runtime) do cérebro/AURA: vêm das Variables do repo (deploy.yml exporta) ou do
      # .env do VPS. As do HARNESS/DOC nascem em 1 (dono, 2026-11-03: "queremos tudo ON"); as outras em 0.
      # Rollback de qualquer uma = Variable "0" + recriar o web (runtime, não precisa rebuild).
      MAP_HARNESS: ${MAP_HARNESS:-0}
      # chat único: motor dos trabalhos (vários por conversa) — par do NEXT_PUBLIC_CHAT_UNICO
      CHAT_UNICO: ${CHAT_UNICO:-0}
      # o trilho do documento: `tccCrossOn` é TCC_CROSS=1 || CHAT_UNICO=1 (lib/tcc/store)
      TCC_CROSS: ${TCC_CROSS:-0}
      # o par de CLIENTE também em runtime: embutido no bundle pelo build-arg lá em cima, mas o
      # SERVIDOR precisa dele em `process.env` pra publicar no recibo o que o cliente recebeu
      NEXT_PUBLIC_TCC_CROSS: ${NEXT_PUBLIC_TCC_CROSS:-0}
      # F2 do documento (lib/documento/escritor): uma chamada por SEÇÃO em vez de um JSON de 8
      # campos. LIGADA; `DOC_POR_SECAO=0` devolve o caminho antigo (corposDoEsboco) byte a byte.
      DOC_POR_SECAO: ${DOC_POR_SECAO:-1}
      # blueprint prático da Sala de Estudos (lib/blueprint) — par do NEXT_PUBLIC_BLUEPRINT_PRATICO; GITHUB_TOKEN opcional
      BLUEPRINT_PRATICO: ${BLUEPRINT_PRATICO:-0}
      # Blueprint REA (lib/rea-blueprint) — par do NEXT_PUBLIC_REA_BLUEPRINT; gateia a composição + /api/rea
      REA_BLUEPRINT: ${REA_BLUEPRINT:-0}
      # vídeo do documento com a Zaeon holograma (lib/videodoc) — par do NEXT_PUBLIC_VIDEO_DOC
      VIDEO_DOC: ${VIDEO_DOC:-0}
      # contrato de capacidade do harness (lib/agent/capacidades): cardápio no prompt do rascunho +
      # rede contra "vou baixar a CSV" sem ninguém baixar nada. Rollback = Variable "0" + recriar o web.
      HARNESS_CAPACIDADE: ${HARNESS_CAPACIDADE:-1}
      # F2 · o modelo escolhe a ferramenta. VOLTAS = teto de custo (vazio = padrão 2).
      HARNESS_ACAO: ${HARNESS_ACAO:-1}
      HARNESS_VOLTAS_ACAO: ${HARNESS_VOLTAS_ACAO:-}
      # F7 · o Pro nas fases pesadas (plus/pro). Vazio = LIGADO (o código trata vazio como ausente);
      # `PRO_PESADAS=0` é o rollback, e precisa chegar nos DOIS serviços pra valer de verdade.
      PRO_PESADAS: ${PRO_PESADAS:-}
      # PUSHER público (tempo real do documento). Embutido no bundle no BUILD pelos build-args, mas o
      # SERVIDOR também lê `process.env` em runtime (lib/collab/realtime getPusher), então precisa
      # estar aqui. O APP_ID/SECRET chegam pelo env_file (.env.secrets), não por aqui.
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
      # a fase `reason` no `elaborated` (o código a pula por padrão; "1" liga)
      RACIOCINIO_ELABORADO: ${RACIOCINIO_ELABORADO:-}
      # F8 · agente de navegador (rota /api/agentic/run + tela /agente, ambas só de fundador).
      # SÓ NO WEB, de propósito: o agente roda onde a ROTA existe, e o `worker` não serve rota
      # nenhuma. Pôr aqui é topologia, não descuido — a mesma razão do CANAL_QUEUE acima. Default
      # 0 pra falhar FECHADO se a cadeia do workflow quebrar; o workflow manda "1".
      AGENTIC_MODE: ${AGENTIC_MODE:-0}
      # F9 · ONDE o navegador do agente roda. Aponta pro container irmão por padrão, igual ao
      # LEITOR_PROXY_URL. Vazia = o Chromium sobe DENTRO do web (caminho da F8, que segue valendo
      # pra dev). Apontar pra um container que não subiu NÃO é mentira silenciosa: o /api/health
      # SONDA o /health dele e o recibo diz "INALCANÇÁVEL" — supor estaria errado.
      AGENTE_URL: ${AGENTE_URL:-http://agente-navegador:8788}
      # F10 · A MESMA allowlist que o container usa. Sem esta linha o web leria só LEITOR_ALLOW e
      # recusaria, na conferência local, domínio que o container aceitaria — duas políticas
      # discordando em silêncio. Default ACADÊMICO de propósito: se a cadeia do workflow quebrar, o
      # agente ESTREITA em vez de abrir (fail-closed numa allowlist é a direção conservadora).
      AGENTE_ALLOW: "${AGENTE_ALLOW:-*.gov.br, *.edu.br, *.scielo.br, *.scielo.org, *.wikipedia.org, arxiv.org, doi.org, *.nih.gov, *.who.int, raw.githubusercontent.com, github.com}"
      AGENTE_TOKEN: ${AGENTE_TOKEN:-}
      # CANAL_QUEUE é o interruptor de ENFILEIRAR (lib/canal/queue `filaLigada`), e por isso mora no
      # WEB: é ele que decide mandar o turno pra fila em vez de rodar inline. Os de CONSUMIR
      # (CANAL_WORKER/CHORES_WORKER) ficam só no serviço `worker` — aqui eles fariam o mesmo
      # container enfileirar E consumir, que é o que a topologia evita. `SCHOLAR_WORKER` já está
      # definido acima com default 0; repeti-lo aqui quebra o compose (chave duplicada).
      CANAL_QUEUE: ${CANAL_QUEUE:-}
      # F3 · o anexo entra no harness (imagem/PDF escaneado seguem no legado).
      HARNESS_ANEXO: ${HARNESS_ANEXO:-1}
      # F4 · cobertura por documento + síntese cruzada (só com 2+ documentos em jogo).
      HARNESS_SINTESE: ${HARNESS_SINTESE:-1}
      # G3 · gráfico na resposta (lib/agent/grafico): SVG desenhado aqui, com número que o turno
      # apurou. Não custa chamada de modelo. `=0` é o kill-switch.
      HARNESS_GRAFICO: ${HARNESS_GRAFICO:-1}
      # F5 · conectores MCP por nome do catálogo (lib/agent/mcp MCP_CATALOG). `scholar` por padrão
      # (decisão do dono, 2026-11-03): 9 tools de LEITURA no trilho de fontes/ABNT. O servidor roda
      # como SUBPROCESSO deste container, pelo binário do `node_modules` — pinado em `scholar-mcp:
      # "1.2.0"`, sem `npx` e sem download em boot. `=0` (ou off/nenhum) é o kill-switch.
      MCP_CONECTORES: ${MCP_CONECTORES:-scholar}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ESTUDO_GATEKEEPER: ${ESTUDO_GATEKEEPER:-0}
      AURA_ECONOMY: ${AURA_ECONOMY:-0}
      CEREBRO_BG: "0"       # "1" SÓ com o worker de pé (profile worker): o job do cérebro vai pra fila "cerebro". 0 = gera inline no web.
      # Gateway de LLM (PR-G1): vazio = Vertex direto (byte a byte como hoje). "http://litellm:4000" só com
      # `--profile gateway` de pé. Só o turno do canal opta; pesquisa/estudos/mentores seguem no Vertex.
      GATEWAY_URL: ${GATEWAY_URL:-}
      # Leitor (Fatia 7, G6): vazio = Leitor fora do ar (lei 5). "http://leitor-proxy:8787" só com o perfil chores de pé.
      LEITOR_PROXY_URL: ${LEITOR_PROXY_URL:-http://leitor-proxy:8787}
      LEITOR_ALLOW: "${LEITOR_ALLOW:-*.gov.br, *.edu.br, *.scielo.br, *.scielo.org, *.wikipedia.org, arxiv.org, doi.org, *.nih.gov, *.who.int, raw.githubusercontent.com, github.com}"
    depends_on:
      redis: { condition: service_started }
      voice-engine: { condition: service_started }
      abnt-service: { condition: service_started }
      pdf-loader: { condition: service_started }
    expose: ["3000"]            # público é só o Caddy
    volumes: ["studio_data:/app/.studio"]   # artefatos do Studio (podcast/imagem) — persistem entre deploys
    # init (tini) como PID 1: recolhe processos órfãos — a captura do Octa (lib/octa/captura.ts) roda Chromium
    # aqui, e o `node server.js` como PID 1 nunca colhe filhos que sobram quando o navegador é morto.
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { memory: 3g }   # era 1536m; o web roda os workers (chat/scholar/cérebro) desde o #526 e o Chromium headless sob demanda (captura do Octa) — a VPS tem 23 GB e usava 3

  # ── SearXNG: busca web self-hosted (metabuscador, sem key, sem custo por query) ──
  # Rede interna (expose, sem porta pública). Config em ./searxng/settings.yml (JSON habilitado).
  searxng:
    image: searxng/searxng:latest
    container_name: zaeon_searxng
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-zaeon-searxng-interno-troque-no-env}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes: ["./searxng/settings.yml:/etc/searxng/settings.yml:ro"]
    expose: ["8080"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512m }

  # ── WORKER dedicado da Sala de Pesquisa (BullMQ) ──────────────────────────────
  # Mesma imagem do web, mas SCHOLAR_WORKER=1: o instrumentation.ts sobe o consumidor
  # da fila e roda o pipeline até o fim, independente de haver cliente na sala. Não é
  # exposto (não recebe HTTP público). Se faltar RAM no VPS, dá pra desligar este serviço
  # e setar SCHOLAR_WORKER=1 no próprio web (o worker roda no processo do web).
  worker:
    # NÃO sobe por padrão (profile "worker"): o background está OFF até validarmos.
    # Ligar depois: `docker compose -f docker-compose.beta.yml --profile worker up -d worker`
    # + SCHOLAR_BG="1" no serviço web.
    profiles: ["worker"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zaeon_worker
    env_file: [.env, .env.secrets]
    environment:
      GIT_SHA: ${GIT_SHA:-unknown}
      NODE_ENV: production
      REDIS_URL: redis://redis:6379/0
      ABNT_SERVICE_URL: http://abnt-service:8001
      PDF_LOADER_URL: http://pdf-loader:8005
      SCHOLAR_BG: "1"
      SCHOLAR_WORKER: "1"
      SCHOLAR_WORKER_CONCURRENCY: "3"
      CHAT_WORKER_CONCURRENCY: "4"     # Fase 3: turnos do chat da Aura na fila "chat"
      # o worker roda O MESMO harness (runChatTurn): sem esta linha a flag valeria só no web,
      # e o turno que fosse pra fila responderia com o comportamento antigo.
      HARNESS_CAPACIDADE: ${HARNESS_CAPACIDADE:-1}
      # F2 · o modelo escolhe a ferramenta. VOLTAS = teto de custo (vazio = padrão 2).
      HARNESS_ACAO: ${HARNESS_ACAO:-1}
      HARNESS_VOLTAS_ACAO: ${HARNESS_VOLTAS_ACAO:-}
      # F7 · o Pro nas fases pesadas (plus/pro). Vazio = LIGADO (o código trata vazio como ausente);
      # `PRO_PESADAS=0` é o rollback, e precisa chegar nos DOIS serviços pra valer de verdade.
      PRO_PESADAS: ${PRO_PESADAS:-}
      # PUSHER público (tempo real do documento). Embutido no bundle no BUILD pelos build-args, mas o
      # SERVIDOR também lê `process.env` em runtime (lib/collab/realtime getPusher), então precisa
      # estar aqui. O APP_ID/SECRET chegam pelo env_file (.env.secrets), não por aqui.
      NEXT_PUBLIC_PUSHER_KEY: ${NEXT_PUBLIC_PUSHER_KEY:-}
      NEXT_PUBLIC_PUSHER_CLUSTER: ${NEXT_PUBLIC_PUSHER_CLUSTER:-}
      # a fase `reason` no `elaborated` (o código a pula por padrão; "1" liga)
      RACIOCINIO_ELABORADO: ${RACIOCINIO_ELABORADO:-}
      # Os de CONSUMIR vivem AQUI, onde consumir é o trabalho do container. `SCHOLAR_WORKER` não
      # aparece de propósito: já é "1" fixo acima, e um `${SCHOLAR_WORKER:-}` o sobrescreveria com
      # VAZIO — o worker dedicado pararia de consumir a fila do scholar. Foi o erro que o parser do
      # Compose pegou (chave duplicada) antes de ir pro ar.
      CANAL_WORKER: ${CANAL_WORKER:-}
      CHORES_WORKER: ${CHORES_WORKER:-}
      CANAL_QUEUE: ${CANAL_QUEUE:-}
      # F3 · o anexo entra no harness (imagem/PDF escaneado seguem no legado).
      HARNESS_ANEXO: ${HARNESS_ANEXO:-1}
      # F4 · cobertura por documento + síntese cruzada (só com 2+ documentos em jogo).
      HARNESS_SINTESE: ${HARNESS_SINTESE:-1}
      # G3 · gráfico na resposta (lib/agent/grafico): SVG desenhado aqui, com número que o turno
      # apurou. Não custa chamada de modelo. `=0` é o kill-switch.
      HARNESS_GRAFICO: ${HARNESS_GRAFICO:-1}
      # F5 · conectores MCP por nome do catálogo (lib/agent/mcp MCP_CATALOG). `scholar` por padrão
      # (decisão do dono, 2026-11-03): 9 tools de LEITURA no trilho de fontes/ABNT. O servidor roda
      # como SUBPROCESSO deste container, pelo binário do `node_modules` — pinado em `scholar-mcp:
      # "1.2.0"`, sem `npx` e sem download em boot. `=0` (ou off/nenhum) é o kill-switch.
      MCP_CONECTORES: ${MCP_CONECTORES:-scholar}
      # geração do documento por SEÇÃO: o worker roda o mesmo runChatTurn → lib/tcc/turno →
      # gerarTccEmBackground, então sem esta linha a Variable valeria só no web (par do #670).
      DOC_POR_SECAO: ${DOC_POR_SECAO:-1}
      # ESPELHO DO TRILHO, pela mesma razão da linha acima — e esta FALTAVA: o worker tinha o
      # DOC_POR_SECAO (escrever as seções) sem o `tccCrossOn` (deixar o trabalho EXISTIR). Com o
      # worker de pé, ele escreveria seções de um documento que não pode nascer. Divergência
      # pré-existente, achada ao fechar o ponto cego do trilho (05/nov/2026).
      CHAT_UNICO: ${CHAT_UNICO:-0}
      TCC_CROSS: ${TCC_CROSS:-0}
      NEXT_PUBLIC_TCC_CROSS: ${NEXT_PUBLIC_TCC_CROSS:-0}
      LEITOR_PROXY_URL: ${LEITOR_PROXY_URL:-http://leitor-proxy:8787}   # Fatia 7: chores leem a web SÓ por aqui
      LEITOR_ALLOW: "${LEITOR_ALLOW:-*.gov.br, *.edu.br, *.scielo.br, *.scielo.org, *.wikipedia.org, arxiv.org, doi.org, *.nih.gov, *.who.int, raw.githubusercontent.com, github.com}"
    depends_on:
      redis: { condition: service_started }
    # mesma imagem do web: turno do Octa na fila também pode capturar (Chromium) → init colhe órfãos
    init: true
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1536m }   # turno do Octa na fila também captura (Chromium)

  # ── Voz neural (Kokoro, CPU-only). Gated por perfil (admin → aba "Voz"). ──
  voice-engine:
    build: { context: ./voice-engine, dockerfile: Dockerfile }
    container_name: zaeon_voice
    environment:
      KOKORO_LANG: p
      ZAEON_TTS_DEFAULT: natural-br   # default Piper (Kokoro lazy, não infla RAM)
      HF_HOME: /app/.hf
    volumes: ["hf_cache:/app/.hf"]   # cacheia os pesos do modelo entre restarts
    expose: ["8004"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1g }   # era 3g (Kokoro); voz padrão é Gemini-TTS (nuvem), local só fallback Piper

  # ── ABNT (FastAPI + LibreOffice headless) ──
  # web depende deste com condition: service_started (não service_healthy):
  # se o abnt demorar/falhar no 1º boot (build do LibreOffice, OOM), o site sobe
  # mesmo assim e a exportação degrada com 503 amigável. O healthcheck abaixo é
  # só observabilidade (docker compose ps mostra healthy/unhealthy).
  abnt-service:
    build: { context: ./abnt-service, dockerfile: Dockerfile }
    container_name: zaeon_abnt
    expose: ["8001"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status==200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    deploy:
      resources:
        limits: { memory: 1200m }

  # ── pdf-loader (FastAPI + opendataloader-pdf, modo FAST). Leitura estruturada de PDF. ──
  #    Sem OCR/Hybrid nesta VPS (RAM). Só rede interna (não publica porta).
  pdf-loader:
    build: { context: ./pdf-loader, dockerfile: Dockerfile }
    container_name: zaeon_pdf
    expose: ["8005"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 896m }

  # ── Mentor no WhatsApp (docs/WHATSAPP_MENTOR.md) — perfil opcional `whatsapp` ──
  #   Subir:  COMPOSE_PROFILES=whatsapp docker compose -f docker-compose.beta.yml up -d --build
  #   agent-bridge = agent-gateway em modo BRIDGE FINO (/webhook/wa → web:/api/whatsapp/webhook).
  #   Sem Postgres/pgvector/arq: o cérebro é o harness do web (Atlas). O sender de saída é o
  #   Evolution abaixo (WHATSAPP_PROVIDER=evolution) OU o repo de disparos/ChipFlow
  #   (WHATSAPP_PROVIDER=disparos, DISPAROS_URL) rodando no compose dele — ver runbook.
  agent-bridge:
    build: { context: ./agent-gateway, dockerfile: Dockerfile }
    container_name: zaeon_agent_bridge
    profiles: ["whatsapp"]
    command: ["uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: [.env]
    environment:
      ZAEON_WEBHOOK_URL: http://web:3000/api/whatsapp/webhook
      # sem DB: o bridge não abre conexão; placeholder só pra Settings não reclamar
      DATABASE_URL: postgresql+asyncpg://unused:unused@localhost/unused
    depends_on:
      web: { condition: service_started }
    expose: ["8000"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 384m }

  # Evolution API v1.x (sem Postgres; estado em volume). Instância ÚNICA da plataforma,
  # conectada 1× por QR pelo admin (número da Zaeon). Webhook da instância → agent-bridge.
  # ⚠️ Não-oficial (Baileys): risco de ban/ToS — MVP. Escala = WhatsApp Cloud API (troca de provider).
  evolution:
    image: atendai/evolution-api:v1.8.2
    container_name: zaeon_evolution
    profiles: ["whatsapp"]
    environment:
      SERVER_URL: http://evolution:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-troque-esta-chave}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "false"
      REDIS_ENABLED: "false"
      RABBITMQ_ENABLED: "false"
      WEBSOCKET_ENABLED: "false"
      QRCODE_LIMIT: "30"
      LOG_LEVEL: "ERROR,WARN"
      DEL_INSTANCE: "false"
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store
    expose: ["8080"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 768m }

  # ── CHIPS DE WHATSAPP (out/2026, docs/WHATSAPP_CHIPS.md) ──────────────────────────────────────────
  #   O whatsapp-adapter (whatsmeow) da ChipFlow rodando DA ZAEON: os chips conectam por QR no "Meu perfil"
  #   (CEO), mandam/recebem pelo bridge Redis (wa:cmd/wa:evt no `redis`, db 5) e o operador HTTP (create/QR/
  #   status/perfil) fica só na rede interna. Sessões whatsmeow no Postgres próprio (wa-db).
  #   Imagem construída na VPS a partir do repo do adapter (o GHCR dele é privado): ver o runbook.
  #   Sobe com WHATSAPP_CHIPS=1 no .env. Perfil PRÓPRIO ("chips"), não o "whatsapp" (que tem o Evolution v1.8.2 e o
  #   agent-bridge antigos, que NÃO devem subir): o deploy nomeia os dois serviços ou liga COMPOSE_PROFILES=chips.
  wa-db:
    image: postgres:16-alpine
    container_name: zaeon_wa_db
    profiles: ["chips"]
    environment:
      POSTGRES_USER: wa
      POSTGRES_PASSWORD: ${WA_DB_PASSWORD:-troque-no-env}
      POSTGRES_DB: wa
    volumes:
      - wa_db:/var/lib/postgresql/data
    expose: ["5432"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wa -d wa"]
      interval: 10s
      timeout: 5s
      retries: 6
    deploy:
      resources:
        limits: { memory: 256m }

  wa-adapter:
    image: ${WA_ADAPTER_IMAGE:-zaeon-wa-adapter:local}
    container_name: zaeon_wa_adapter
    profiles: ["chips"]
    environment:
      DRIVER_KIND: whatsmeow
      ROUTING_MODE: redis_bridge
      DATABASE_URL: postgres://wa:${WA_DB_PASSWORD:-troque-no-env}@wa-db:5432/wa?sslmode=disable
      WHATSMEOW_DSN: postgres://wa:${WA_DB_PASSWORD:-troque-no-env}@wa-db:5432/wa?sslmode=disable
      REDIS_URL: redis://redis:6379/5
      NUM_SHARDS: "1"
      ADAPTER_SHARD: "0"
      OPERATOR_ADDR: ":9091"
      OPERATOR_TOKEN: ${WA_OPERATOR_TOKEN:-}
      METRICS_PORT: "9090"
    depends_on:
      wa-db: { condition: service_healthy }
      redis: { condition: service_started }
    expose: ["9091"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 512m }

  # ── LEITOR (Fatia 7, G6) — o ÚNICO que sai para a internet a serviço de chore ──
  #    SEM env_file, SEM volume do app, SEM credencial: comprometido, consegue… ler a web.
  #    Allowlist default-deny (LEITOR_ALLOW). Interno (expose). Teste: lib/leitor/compose.test.ts pina isto.
  #    Ligar: docker compose -f docker-compose.beta.yml --profile chores up -d leitor-proxy
  leitor-proxy:
    profiles: ["chores"]
    build: { context: ./services/leitor-proxy, dockerfile: Dockerfile }
    container_name: zaeon_leitor_proxy
    environment:
      # LIGADO POR PADRÃO (dono, 2026-11-03: "queremos tudo ON"). Esta lista é CONSERVADORA de
      # propósito — fonte acadêmica, governo e referência. Allowlist é decisão de segurança:
      # estender é pôr a Variable LEITOR_ALLOW. A MESMA string vale no web e no worker (eles
      # usam a presença dela pra decidir se registram abrir_url) — lib/leitor/compose.test.ts pina.
      LEITOR_ALLOW: "${LEITOR_ALLOW:-*.gov.br, *.edu.br, *.scielo.br, *.scielo.org, *.wikipedia.org, arxiv.org, doi.org, *.nih.gov, *.who.int, raw.githubusercontent.com, github.com}"
      # TEXTO: 2 MiB (o `response cap` do web.fetch da Rovinos, issue #98 — ver server.mjs).
      LEITOR_MAX_BYTES: ${LEITOR_MAX_BYTES:-2097152}
      # BYTES (/bytes, F1b): 25 MB = lib/rag/ingerir.MAX_BYTES, o teto do único destino deles.
      LEITOR_MAX_BYTES_BIN: ${LEITOR_MAX_BYTES_BIN:-26214400}
      LEITOR_MAX_INFLIGHT: ${LEITOR_MAX_INFLIGHT:-8}
    expose: ["8787"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: [/tmp]
    mem_limit: 128m
    restart: unless-stopped

  # ── AGENTE DE NAVEGADOR (F9) — perfil "agente": Chromium headless, SOMENTE LEITURA, SEM CREDENCIAL ──
  #    Irmão do leitor-proxy, pela MESMA razão e com as mesmas camadas; a diferença é que este
  #    EXECUTA JAVASCRIPT (o Leitor, de propósito, não), que é o único motivo de ele existir.
  #    Na F8 este Chromium subia dentro do `web`: disputava memória com quem serve o site (daí os
  #    tetos de 12 passos / 3 min) e ficava no container que tem as credenciais. Aqui, nenhum dos dois.
  #    SEM env_file e SEM segredo — lib/agent/agenteCompose.test.ts pina isso, como o do Leitor.
  agente-navegador:
    profiles: ["agente"]
    build: { context: ./services, dockerfile: agente-navegador/Dockerfile }
    container_name: zaeon_agente_navegador
    environment:
      # A MESMA allowlist do Leitor, lida da MESMA Variable: `AGENTE_ALLOW` só existe pra permitir
      # divergir de propósito um dia; vazia ou ausente, o server cai em LEITOR_ALLOW.
      # NOME e VALOR agora batem: esta linha dizia `AGENTE_ALLOW` e lia `${LEITOR_ALLOW}`
      # (defeito meu na F9), então o workflow mandando `*` nunca chegava aqui e as duas pontas
      # discordariam em silêncio. A ponte AGENTE_ALLOW←LEITOR_ALLOW é feita no SHELL do deploy,
      # num nível só — interpolação aninhada do Compose eu não consigo testar neste ambiente.
      AGENTE_ALLOW: "${AGENTE_ALLOW:-*.gov.br, *.edu.br, *.scielo.br, *.scielo.org, *.wikipedia.org, arxiv.org, doi.org, *.nih.gov, *.who.int, raw.githubusercontent.com, github.com}"
      AGENTE_MAX_TEXTO: ${AGENTE_MAX_TEXTO:-20000}
      AGENTE_TIMEOUT_MS: ${AGENTE_TIMEOUT_MS:-20000}
      # F10 · A ÚNICA credencial deste container, e ela é exceção NOMEADA à regra "zero credencial",
      # não um afrouxamento dela: o token dá acesso AO PRÓPRIO NAVEGADOR, não a Vertex/Mongo/Pusher.
      # Quem já comprometeu este container não ganha nada novo com ele. Vazio = sem autenticação, que
      # é o modo correto na rede interna do compose (a fronteira do compose é o controle, como no
      # leitor-proxy). OBRIGATÓRIO quando o serviço roda em OUTRO SERVIDOR — aí a porta atravessa
      # internet e o cliente RECUSA conectar sem token (lib/agent/navegadorRemoto).
      AGENTE_TOKEN: ${AGENTE_TOKEN:-}
      # O OPT-IN ao modo sem autenticação. AQUI a afirmação "estou na rede interna" é verdadeira por
      # construção: este serviço só faz `expose`, nunca `ports`, então a fronteira do compose é real.
      # O servidor falha FECHADO sem esta env (#716, achado do Sourcery): antes, token vazio
      # autorizava QUALQUER chamador, e a única defesa era no cliente — que não é quem está exposto.
      # Assim o MESMO código em outro servidor EXIGE AGENTE_TOKEN. Com token, o token manda.
      AGENTE_SEM_TOKEN: "1"
    expose: ["8788"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # /tmp é onde o perfil do Chromium e o shm de fallback vivem (o container é read_only).
    tmpfs: ["/tmp:size=512m,mode=1777"]
    shm_size: 256m
    # 1,5 GB PRÓPRIOS: era isto o pedido do dono. A VPS tem 23 GB e o compose declarava 13,8 GB,
    # então sobra. Chromium headless com um renderer fica bem abaixo disso; o teto existe pra uma
    # página patológica não comer o host, não porque 1,5 GB seja o uso esperado.
    mem_limit: 1536m
    restart: unless-stopped

  # ── GATEWAY de LLM (LiteLLM, PR-G1) — perfil "gateway": NÃO sobe no deploy enxuto por acidente ──
  #    Interno (expose, sem ports): só o web fala http://litellm:4000. UI /ui só por ssh -L.
  #    Redis = este serviço redis (TCP; LiteLLM não fala Upstash REST). Config versionada em infra/.
  #    Segredos (GATEWAY_MASTER_KEY, LITELLM_DATABASE_URL, LITELLM_SALT_KEY, POSTGRES) vêm do .env/.env.secrets do VPS.
  #    Ligar: docker compose -f docker-compose.beta.yml --profile gateway up -d litellm
  litellm:
    # Tag FIXA (a main-stable de 2026-10-07 veio sem litellm.proxy.guardrails.guardrail_helpers e quebrou /key/generate).
    # Trocar de versão = LITELLM_IMAGE_TAG no .env do VPS (testar /key/generate antes de deixar).
    image: ghcr.io/berriai/litellm:${LITELLM_IMAGE_TAG:-v1.103.4}
    container_name: zaeon_litellm
    profiles: ["gateway"]
    env_file: [.env, .env.secrets]
    environment:
      LITELLM_LOG: "ERROR"
      LITELLM_MODE: "PRODUCTION"
      # Explícito além do general_settings.database_url: no gate local o readiness veio "db: disconnected"
      # quando o LiteLLM subiu antes do Postgres — virtual keys (PR-G2) EXIGEM o banco.
      DATABASE_URL: ${LITELLM_DATABASE_URL:-}
      # Location do Gemini TEXTO (lib/ai/vertex-credentials geminiTextLocation): "global" espalha a cota
      # e é onde o 3.5-flash existe. Sem a env = GOOGLE_LOCATION (comportamento antigo).
      GEMINI_TEXT_LOCATION: ${GEMINI_TEXT_LOCATION:-${GOOGLE_LOCATION:-us-central1}}
    command: ["--config", "/app/litellm.config.yaml", "--port", "4000"]
    volumes: ["./infra/litellm.config.yaml:/app/litellm.config.yaml:ro"]
    expose: ["4000"]
    depends_on:
      litellm-db: { condition: service_healthy }   # só sobe com o Postgres pronto (senão fica sem DB e sem keys)
      redis: { condition: service_started }
    restart: unless-stopped
    healthcheck:
      # a imagem do LiteLLM NÃO tem wget (ficava "unhealthy" com o proxy no ar) — usa o python dela
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { memory: 2g }   # era 768m: 747 MB reais, bateu no teto 1411× (memory.max) — cada aperto deixava o gateway lento

  litellm-db:
    image: postgres:16-alpine
    container_name: zaeon_litellm_db
    profiles: ["gateway"]
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_PG_PASSWORD:-}   # obrigatório SÓ no perfil gateway; ":-" porque o compose interpola o arquivo inteiro mesmo sem o perfil (um ":?" quebraria o deploy enxuto)
    volumes: ["litellm_pg:/var/lib/postgresql/data"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits: { memory: 256m }

  redis:
    image: redis:7-alpine
    container_name: zaeon_redis
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "768mb", "--maxmemory-policy", "noeviction"]   # BullMQ exige noeviction: com allkeys-lru o Redis podia jogar fora um turno do chat (CHAT_BG)
    volumes: ["redis_data:/data"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { memory: 1g }   # acima do --maxmemory 768mb (senão o kernel mata o Redis antes do limite dele)

  # ── REALTIME do cyberespaço (Colyseus self-hosted): posição/presença + signaling da voz ──
  #    docs/REALTIME_COLYSEUS_VOZ.md. Só rede interna; o público entra pelo Caddy em wss://<domínio>/colyseus.
  #    REALTIME_SECRET (no .env do VPS) = o MESMO do web (o web assina o token de entrada, aqui só se confere).
  #    Só é usado quando NEXT_PUBLIC_REALTIME=colyseus; com "pusher" (padrão) fica de pé sem ninguém conectar.
  colyseus:
    build: { context: ./server/colyseus, dockerfile: Dockerfile }
    container_name: zaeon_colyseus
    env_file: [.env]
    environment:
      PORT: "2567"
      NODE_ENV: production
    expose: ["2567"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2567/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 256m }

  caddy:
    image: caddy:2-alpine
    container_name: zaeon_caddy
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      BETA_DOMAIN: ${BETA_DOMAIN:-beta.zaeon.space}
      ACME_EMAIL: ${ACME_EMAIL:-admin@zaeon.space}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [web]
    deploy:
      resources:
        limits: { memory: 256m }

volumes:
  wa_db:
  redis_data:
  evolution_instances:   # sessão da instância única do WhatsApp (perfil whatsapp)
  evolution_store:
  caddy_data:
  caddy_config:
  hf_cache:        # pesos do Kokoro (HuggingFace) — evita re-download a cada restart
  studio_data:     # artefatos do Studio (podcast/imagem) gerados em /app/.studio
  litellm_pg:      # Postgres do gateway LiteLLM (virtual keys, budgets) — perfil gateway
